name: consus-team
description: Full-stack team for Consus — React/Vite UI, Node/Fastify server, SQLite KB store, Pantheon adapter integrations.
lead: team-lead
methodology: hybrid   # BDD for UI, TDD for backend — see hive.config.yaml → developer.notes

members:
  - agent: frontend-developer
    role: Consus Web UI (React/Vite) — queue, doc browser, comment threads, KB browser
    domain:
      - path: web/**
        read: true
        write: true
        delete: false
    context_note: Uses BDD (Given/When/Then) per project methodology.

  - agent: backend-developer
    role: Consus Server (Fastify) + adapters (Minerva, Auriga Tracker Reader, Multica Client) + KB Store (SQLite)
    domain:
      - path: server/**
        read: true
        write: true
        delete: false
    context_note: Uses TDD per project methodology.

  - agent: architect
    role: Own the Minerva/Auriga/Multica contract boundaries; update architecture.md as docs/contracts/pantheon-contract-levels.md lands

  - agent: tester
    role: Test authoring and execution across web/ and server/
    domain:
      - path: "**/*.test.*"
        read: true
        write: true
        delete: false

  - agent: reviewer
    role: Code review
    tool_access: [codex]   # codex CLI detected during kickoff integration preflight
    # no domain override — uses agent default (read-only everywhere)

context:
  tech_stack:
    frontend: react+vite
    backend: node+typescript (fastify)
    database: sqlite
    realtime: websocket
  commit_granularity: medium
  pr_style: single-commit
  review_depth: thorough
  notes: |
    Generated from Consus's greenfield kickoff (architecture.md).
    Directory layout (web/, server/) is provisional — not yet scaffolded on disk.
    Auriga Tracker Reader's schema is intentionally unconfirmed pending
    docs/contracts/pantheon-contract-levels.md — see architecture.md → Risks.

team_memory_path: .pHive/team-memories/consus-team/
