version: dostal:concept-selection/v1
title: 'Consus brand: select the logo concept direction'
context: Five logo concepts were produced for Consus's first real brand system, grounded in the name's own mythology (granary + secret counsel). Pick the direction to build on.
concepts:
  - id: pure-wordmark
    name: Pure Wordmark
    description: Consus set in Fraunces Bold — the name alone carries the whole personality, for contexts where space is tight or the name itself is the point.
    preview:
      kind: svg
      markup: |-
        <svg viewBox="0 0 240 80" width="220" height="74" role="img" aria-label="Consus wordmark">
                    <text x="120" y="52" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="46" fill="#362B6B">Consus</text>
                  </svg>
  - id: wordmark-symbol
    name: Wordmark + Symbol
    description: The grain-kernel glyph paired with the wordmark, for headers and marketing surfaces where name and mark should register together.
    preview:
      kind: svg
      markup: |-
        <svg viewBox="0 0 240 80" width="220" height="74" role="img" aria-label="Consus wordmark with grain-kernel symbol">
                    <g transform="translate(2,8) scale(0.30)">
                      <path d="M60,14 C76,14 86,38 86,60 C86,82 76,106 60,106 C44,106 34,82 34,60 C34,38 44,14 60,14 Z" fill="#9C6316"/>
                      <path d="M60,26 Q68,60 60,94" fill="none" stroke="#FAF7F0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                      <circle cx="60" cy="76" r="7" fill="#FAF7F0"/>
                    </g>
                    <text x="54" y="52" text-anchor="start" font-family="Fraunces" font-weight="700" font-size="42" fill="#362B6B">Consus</text>
                  </svg>
  - id: monogram
    name: Monogram
    description: An open "C" arc — the granary door, standing ajar — wrapped around the kernel glyph. More identity than a wordmark, less weight than a full badge.
    preview:
      kind: svg
      markup: |-
        <svg viewBox="0 0 120 120" width="110" height="110" role="img" aria-label="Consus monogram, an open C wrapping the grain kernel">
                    <path d="M 101.57,36 A 48,48 0 1 0 101.57,84" fill="none" stroke="#362B6B" stroke-width="9" stroke-linecap="round"/>
                    <g transform="translate(60,60) scale(0.62) translate(-60,-60)">
                      <path d="M60,14 C76,14 86,38 86,60 C86,82 76,106 60,106 C44,106 34,82 34,60 C34,38 44,14 60,14 Z" fill="#9C6316"/>
                      <path d="M60,26 Q68,60 60,94" fill="none" stroke="#FAF7F0" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
                      <circle cx="60" cy="76" r="8" fill="#FAF7F0"/>
                    </g>
                  </svg>
  - id: abstract-mark
    name: Abstract Mark
    description: The kernel alone — its crease and punched "eye" are the whole story. Holds up at 16px, which makes it the candidate for the dock icon, tray icon, and favicon.
    preview:
      kind: svg
      markup: |-
        <svg viewBox="0 0 120 120" width="110" height="110" role="img" aria-label="Consus abstract grain-kernel mark">
                    <circle cx="60" cy="60" r="54" fill="none" stroke="#362B6B" stroke-width="1" opacity="0.15"/>
                    <path d="M60,14 C76,14 86,38 86,60 C86,82 76,106 60,106 C44,106 34,82 34,60 C34,38 44,14 60,14 Z" fill="#362B6B"/>
                    <path d="M60,26 Q68,60 60,94" fill="none" stroke="#FAF7F0" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
                    <circle cx="60" cy="76" r="8" fill="#FAF7F0"/>
                  </svg>
  - id: badge-seal
    name: Badge / Seal
    description: The kernel ringed by arced "CONSUS," like a Roman coin or wax seal — for a splash screen or About panel where the mythic register can run full ceremonial.
    preview:
      kind: svg
      markup: |-
        <svg viewBox="0 0 120 120" width="110" height="110" role="img" aria-label="Consus badge, a seal with arced CONSUS text around the grain kernel">
                    <defs>
                      <path id="sealArc" d="M 20,64 A 40,40 0 0 1 100,64" fill="none"/>
                    </defs>
                    <circle cx="60" cy="60" r="56" fill="none" stroke="#362B6B" stroke-width="2.5"/>
                    <circle cx="60" cy="60" r="45" fill="none" stroke="#9C6316" stroke-width="1"/>
                    <text font-family="IBM Plex Sans" font-weight="600" font-size="11" letter-spacing="2.5" fill="#362B6B">
                      <textPath href="#sealArc" startOffset="50%" text-anchor="middle">CONSUS</textPath>
                    </text>
                    <g transform="translate(60,66) scale(0.46) translate(-60,-60)">
                      <path d="M60,14 C76,14 86,38 86,60 C86,82 76,106 60,106 C44,106 34,82 34,60 C34,38 44,14 60,14 Z" fill="#9C6316"/>
                      <path d="M60,26 Q68,60 60,94" fill="none" stroke="#FAF7F0" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
                      <circle cx="60" cy="76" r="8" fill="#FAF7F0"/>
                    </g>
                  </svg>
