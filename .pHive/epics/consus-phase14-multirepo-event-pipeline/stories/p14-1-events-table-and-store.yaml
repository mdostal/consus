design_decisions:
  - decision: "events is a wholly new table, independent of proposals, with its own status enum (new/in_progress/done/dismissed) rather than a new proposals.status value."
    rationale: "Decided in docs/design-discussion.md's 'Event data model' section: a proposals row always represents an attempted harness dispatch; an event is a pre-decision review-queue item that may never become a proposal. Conflating the two enums would teach every existing proposals consumer (UI polling, reportProposalResult, the applied-status audit-log write) to treat a new, unrelated status as inert. This story just builds the table the design settled on — no new judgment call here."
  - decision: "Archival is modeled as an archived_at timestamp column on the same events row, not a separate history table, and it is derived automatically by updateEventStatus from the status value rather than being a caller-supplied field."
    rationale: "Matches the operator's resolution ('Retention — RESOLVED: archival history... Modeled as an archived_at timestamp on the same events row... GET /api/events excludes archived rows by default'). Deriving it inside updateEventStatus (rather than requiring every caller to remember to set it) makes the done/dismissed <-> archived relationship a single-source-of-truth invariant instead of a convention callers could get wrong."
  - decision: "listEvents' sort/order values are validated against a small fixed allow-list (detected_at/status/project, asc/desc) before being spliced into the ORDER BY clause, rather than being parameterized with `?` (which SQL does not support for column/direction names)."
    rationale: "The only safe way to accept a caller-influenced column/direction name in a hand-written SQL string is an allow-list lookup, not string interpolation of the raw value — flagged explicitly for the reviewer step so this doesn't get missed under the pressure of 'it's just an internal filter param.'"

risks:
  - severity: low
    description: "No migrate.test.ts may currently exist as a dedicated file (other tables' schema might only be indirectly exercised via route tests) — the write-failing-tests step may need to create one rather than extend an existing file, changing the shape of that step's diff slightly."
    mitigation: "Step description explicitly says 'check first' rather than assuming; either outcome (new file or extended file) satisfies the same acceptance criteria."
  - severity: low
    description: "SQLite does not enforce FOREIGN KEY constraints by default (PRAGMA foreign_keys is off unless explicitly enabled), so events.item_id/proposal_id referencing items/proposals is documentation-level, not an enforced invariant — an orphaned reference wouldn't raise a database error."
    mitigation: "Matches the existing behavior of every other REFERENCES column already in this schema (e.g. proposals.item_id, audit_log.item_id) — not a new gap introduced by this story, and out of scope to change the codebase's FK enforcement posture here."
