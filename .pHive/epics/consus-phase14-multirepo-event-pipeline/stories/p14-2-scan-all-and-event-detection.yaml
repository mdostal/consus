design_decisions:
  - decision: "detectEvents snapshots doc_index before and after scanRepo's call, in the caller, rather than modifying scanRepo to emit change notifications itself."
    rationale: "The design doc is explicit: 'no change to scanRepo itself' — scanRepo stays the single, simple, already-tested upsert primitive. A before/after snapshot diff achieves the same detection outcome (which rows actually changed) without adding an event-aware code path inside a function whose whole value is being a small, generic, repo-agnostic scanner."
  - decision: "decision_needed's tracking item uses a new decisionItemId = `decision:${repo}:${path}` namespace, distinct from docItemIdFor's `doc:${repo}:${path}`."
    rationale: "Judgment call — the design doc mentions 'no existing open tracking item' but doesn't specify an id scheme. docItemIdFor's existing upsert only refreshes updated_at on conflict, never type or decision_payload, so reusing its id for a decision item would silently fail to carry decision fields whenever a doc-item row already existed at that id (or vice versa). A separate namespace sidesteps the collision entirely rather than teaching docItemIdFor's upsert new conflict-branching logic that every other caller of it (docs.ts's GET /api/docs/content) would need to keep working around."
  - decision: "'No existing open tracking item' is resolved as a content-hash-scoped drift check against open events (same repo/path/trigger_kind/content_hash), not a bare existence check against the items table."
    rationale: "A bare existence check ('does any tracking item exist yet, decided or not') would either never re-fire once an item exists (stale forever) or always re-fire on every scan of an untouched-but-still-undecided doc (event spam) — neither matches the operator's resolved staleness policy (Open questions #2: no silent mutation of an open event, but a new event when content drifts further). Scoping the check to content_hash directly encodes that policy instead of approximating it."
  - decision: "The doc_changed diff's 'prior content' comes from a best-effort git HEAD lookup (readGitDoc(...,\"HEAD\")), not from any newly-added Consus-side content history."
    rationale: "Judgment call, flagged in the top-level report — doc_index only ever stores a hash, never content, and this epic's search story (p14-4) explicitly avoids adding a new content-index table as a design principle ('no new content index table... consistent with reading content live off disk'). Reusing the existing, already-tested, ref-aware readGitDoc keeps this story from inventing a second, bespoke content-history mechanism just for diffing, at the acknowledged cost of the diff being best-effort (accurate when the prior version was committed and HEAD hasn't since caught up to the new content; a clearly-labeled full-content fallback otherwise) rather than a guaranteed-exact diff against whatever the previous scan actually saw."
  - decision: "The section splitter for composed_prompt's 'surrounding doc content' is a server-side port of web/src/features/docs/sections.ts's splitIntoSections, not a shared import."
    rationale: "This repo has no shared code path between web/ and server/ (confirmed by every other cross-boundary case in this codebase, e.g. textDiff.ts's algorithm being reimplemented rather than imported for p8-02's client-side flow) — duplicating one small, pure, already-tested function is the established pattern here, not a gap introduced by this story."

risks:
  - severity: medium
    description: "The doc_changed diff-against-HEAD heuristic can be wrong in either direction: if a change was committed and HEAD already reflects it, the fallback (full-content diff) fires even though a real prior version does exist further back in git history; if the working tree has diverged from HEAD in a way unrelated to this specific doc's change, the HEAD comparison could show unrelated noise as part of the diff."
    mitigation: "Explicitly scoped as best-effort in the design_decisions above and called out in the epic-level report as a judgment call, not a silent gap. The composed_prompt always states plainly which path was taken ('no prior content on record' vs. an actual HEAD-based diff), so a reviewer is never misled about what they're looking at, even when the diff itself is imperfect."
  - severity: medium
    description: "detectEvents runs a readDocContent + (for changed files) readGitDoc git-subprocess call per changed/new file, on top of scanRepo's own per-file hash read — for a repo with many changed files in one scan, this roughly doubles or triples the I/O of a plain scanRepo call."
    mitigation: "Matches the design doc's own flagged risk ('Scan cost at scale... fine for a handful of projects, but dozens of large repos could eventually need a per-repo timeout/skip') — out of scope to solve here; not a regression this story introduces beyond what the design doc already anticipated."
  - severity: low
    description: "Two independent copies of the LCS line-diff algorithm (client and server) can drift apart over time if one is changed without the other."
    mitigation: "Both are small (~40 lines), pure, and covered by their own tests; a drift would only change the cosmetic shape of diff output, never correctness of what triggers an event. Flagged in design_decisions as the deliberate, scoped-for tradeoff over introducing a shared package boundary for one function."
