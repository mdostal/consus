design_decisions:
  - decision: "No new diagrams cache table — the architecture endpoint generates on every request."
    rationale: "server/db/migrate.ts has no diagrams-cache table today. The precedent's cache existed to avoid re-hitting a slow external issue tracker for the cascade diagram; this generator is a bounded (depth-2, 50-node-capped) local fs walk with no such dependency, and this repo's real scale is a handful of local, single-operator repos. A cache table would add a migration and invalidation reasoning for a benefit that doesn't materialize here. See design-discussion.md."
  - decision: "New route is GET /api/diagrams/:repo/architecture, a distinct path from the existing GET /api/diagrams?repo= cascade endpoint, not a merge or a query-param variant."
    rationale: "Keeps the existing cascade endpoint's contract, route registration, and test file completely untouched, per this epic's explicit small-scope constraint — this is a new endpoint, not a rewrite of the existing one."
  - decision: "A new ArchitectureDiagramView component is added; DiagramView.tsx is not modified or refactored to share rendering code."
    rationale: "DiagramView.tsx is structurally coupled to DiagramEpic[]/DiagramStory[] (node-lookup-by-id click-to-detail, propose-a-change UI) that doesn't apply to a raw two-graph Mermaid response. Extracting a shared render helper would mean touching DiagramView.tsx and its test file for an unrelated feature, raising regression risk on the cascade view for no functional benefit at this scope. The ~15-line render-with-timeout pattern is duplicated instead."
  - decision: "Design-discussion.md file-path mention folding is ported from the archived precedent."
    rationale: "It was already pure local file reads with a per-doc try/catch (no coupling to any external system) and adds real value — surfacing files planning docs call out that a bare directory walk wouldn't show — so there's no standalone-only reason to drop it."

risks:
  - severity: low
    description: "The 50-component cap can cut off mid-walk on a repo with many top-level/nested directories, omitting some real directories from fullComponent (alphabetical order, not importance order)."
    mitigation: "Same tradeoff the archived precedent made; documented at the MAX_COMPONENTS constant. Acceptable for a diagram meant to give a shape overview, not an exhaustive inventory."
  - severity: low
    description: "The design-discussion.md mention regex is heuristic — can miss real paths not backtick-quoted, or match backtick spans that merely look path-like."
    mitigation: "Treated as best-effort enrichment only; the directory walk remains the primary, reliable signal. Not a source of truth for correctness-sensitive use."
  - severity: low
    description: "On-demand generation re-walks the filesystem on every request, with no caching."
    mitigation: "Bounded by the depth-2/50-node cap regardless of true repo size; acceptable at this repo's local, single-operator scale per design-discussion.md's cache-table decision. Revisit if scale assumptions change."
