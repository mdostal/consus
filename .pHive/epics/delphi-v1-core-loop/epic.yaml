name: delphi-v1-core-loop
title: Delphi v1 — Core Loop (Minerva Q&A, doc surface, KB store, decision contract, Vesta/votem, Multica/Auriga integration)
description: >
  Decomposition of .pHive/planning/prd.md's REQ-01 through REQ-15 into an
  agent-ready epic. Revision 2: reconciled against docs/prior-art.md (a real
  prior /delphi implementation + accumulated design decisions) before any
  code was written — REQ-11..REQ-15 (decision-request/v1 contract, taxonomy +
  triage, Vesta policy, votem quorum routing, decision-card rendering
  baseline) were added and promoted to P0. P1 (REQ-09/10) remains flex/stretch
  scope that may slip to v2 per the Product Brief.
target_codebase: /Users/mdostal/Code/delphi
methodology: hybrid   # BDD for UI stories, TDD for backend/adapter stories — see hive.config.yaml
version_bump: minor
sidecar_retention: transient   # no HTML sidecars generated this session — visual planning skipped

git_flow:
  base_branch: main
  branch_strategy: per-epic

source_docs:
  - .pHive/planning/product-discovery-brief.md
  - .pHive/planning/product-brief.md
  - .pHive/planning/prd.md
  - .pHive/planning/architecture.md
  - docs/prior-art.md
  - docs/north-star.md

stories:
  # Wave 0 — root
  - id: delphi-project-scaffold
    title: Scaffold Delphi's server + SPA + SQLite foundation
    complexity: medium
    depends_on: []

  # Wave 1 — parallel, bounded-slice, depend only on scaffold
  - id: doc-scanner-and-index
    title: Doc Scanner — index generated docs by repo/epic/phase
    complexity: medium
    depends_on: [delphi-project-scaffold]
  - id: kb-store-schema-and-decide-api
    title: KB Store — schema, audit log, versions, decide API
    complexity: high
    depends_on: [delphi-project-scaffold]
  - id: minerva-adapter-bridge
    title: Minerva Adapter — Question bridge (REQ-01)
    complexity: high
    depends_on: [delphi-project-scaffold]
  - id: multica-client-comment-write
    title: Multica Client — comment/decision read-write (REQ-07)
    complexity: high
    depends_on: [delphi-project-scaffold]
  - id: auriga-tracker-reader
    title: Auriga Tracker Reader — read-only state consumption (REQ-06)
    complexity: medium
    depends_on: [delphi-project-scaffold]
  - id: decision-request-v1-contract
    title: Decision Contract (decision-request/v1) + deterministic renderer selection
    complexity: high
    depends_on: [delphi-project-scaffold]
  - id: vesta-policy-adapter
    title: Vesta Policy Adapter — read approval policy, resolve auto-accept (REQ-13)
    complexity: medium
    depends_on: [delphi-project-scaffold]

  # Wave 2
  - id: decision-taxonomy-and-triage
    title: Decision-type taxonomy + triage bucket classifier
    complexity: medium
    depends_on: [decision-request-v1-contract]
  - id: decision-card-renderer-ui
    title: Decision Card Renderer — theme-aware baseline UX (REQ-15)
    complexity: high
    depends_on: [decision-request-v1-contract]
  - id: votem-quorum-router
    title: votem Quorum Router — hand off quorum-scoped decisions (REQ-14)
    complexity: medium
    depends_on: [vesta-policy-adapter]
  - id: comment-thread-ui
    title: Comment/Chat Thread UI — iterate in place (REQ-04)
    complexity: medium
    depends_on: [multica-client-comment-write]
  - id: living-docs-overlay
    title: "[P1 stretch] Living Docs Overlay"
    complexity: high
    depends_on: [doc-scanner-and-index, multica-client-comment-write]

  # Wave 3
  - id: doc-browser-ui
    title: Doc Browser UI — render generated docs by repo/epic/phase
    complexity: medium
    depends_on: [doc-scanner-and-index, decision-card-renderer-ui]
  - id: minerva-qa-queue-ui
    title: Minerva Q&A Queue UI — answer async (REQ-02)
    complexity: medium
    depends_on: [minerva-adapter-bridge, kb-store-schema-and-decide-api, decision-card-renderer-ui]

  # Wave 4
  - id: kb-decide-ui
    title: KB Browser UI — view + decide on items
    complexity: medium
    depends_on: [kb-store-schema-and-decide-api, doc-browser-ui, decision-card-renderer-ui]
  - id: artifact-link-registry
    title: Artifact Link Registry — surface existing claude.ai Artifacts
    complexity: low
    depends_on: [doc-browser-ui]

  # Wave 5
  - id: kb-backlog-full-crud
    title: "[P1 stretch] KB Backlog — full browse + edit + chat"
    complexity: high
    depends_on: [kb-decide-ui]

requirements_traceability:
  REQ-01: [minerva-adapter-bridge]
  REQ-02: [minerva-qa-queue-ui]
  REQ-03: [doc-scanner-and-index, doc-browser-ui]
  REQ-04: [comment-thread-ui]
  REQ-05: [artifact-link-registry]
  REQ-06: [auriga-tracker-reader]
  REQ-07: [multica-client-comment-write]
  REQ-08: [kb-store-schema-and-decide-api, kb-decide-ui]
  REQ-09: [kb-backlog-full-crud]
  REQ-10: [living-docs-overlay]
  REQ-11: [decision-request-v1-contract, decision-card-renderer-ui]
  REQ-12: [decision-taxonomy-and-triage]
  REQ-13: [vesta-policy-adapter]
  REQ-14: [votem-quorum-router]
  REQ-15: [decision-card-renderer-ui]
  gaps: []   # all 15 PRD requirements mapped to at least one story

prior_art_reconciliation: >
  Revision 2 of this epic. docs/prior-art.md and a docs/north-star.md addition
  landed on this branch after revision 1 was planned but before any code was
  written (verified via `git log` + `git status` — no scaffold files existed).
  Five stories were added (decision-request-v1-contract, decision-taxonomy-and-
  triage, decision-card-renderer-ui, vesta-policy-adapter, votem-quorum-router)
  and three existing UI stories (doc-browser-ui, kb-decide-ui, minerva-qa-queue-ui)
  were repointed to depend on decision-card-renderer-ui so they share one
  rendering primitive instead of three divergent ones. See product-brief.md
  "Prior Art Reconciliation" and architecture.md's reconciliation note for the
  full rationale. Recommended pre-implementation follow-up: fetch the real
  decision-request.ts from the hive host (ssh dostal@100.75.161.82) before
  decision-request-v1-contract's implement step — flagged in that story's Risks.

deferred_ceremony_note: >
  This epic was decomposed directly from existing product-discovery-brief /
  product-brief / prd / architecture docs (already produced earlier in this
  kickoff) rather than re-running /plan's research + design-discussion +
  H/V-plan phases from scratch — those artifacts already satisfy that intent.
  Visual planning (HTML sidecars, concept illustration) and the full
  planning-classification/planning-routing teammate-dispatch infrastructure
  were not invoked this session; /design wireframes for each UI story are
  explicitly deferred (see each UI story's ui-design step) rather than
  fabricated. Telemetry/KG-emit calls (kg_emit_cli, scope_drift emit,
  gate-lift audit) were skipped as they depend on hive.lib being on the
  Python path from this repo's cwd, which was not verified — all are
  documented as fire-and-forget/best-effort in their own skill, so skipping
  them does not affect story correctness.

execution_note: >
  Delegation via the Agent tool was blocked by a repo hook
  (check-agent-misuse.sh) directing natural-language teammate spawning
  instead; that mechanism produced no verifiable work (no files, no commits).
  Per operator decision (2026-07-25), execution proceeds with the orchestrator
  implementing each story directly (Write/Edit/Bash) rather than delegating,
  since delegation could not be verified as functional in this environment.
