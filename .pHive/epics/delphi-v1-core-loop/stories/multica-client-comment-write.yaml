id: multica-client-comment-write
epic: delphi-v1-core-loop
title: Multica Client — comment/decision read-write (REQ-07)
status: pending
complexity: high
methodology: tdd
depends_on: [delphi-project-scaffold]
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Implement REQ-07: a REST + WebSocket client against Multica's self-hosted
  API server (per `multica setup self-host --server-url ... --app-url ...`)
  for comment/decision read-write, so decisions made in Delphi are visible
  to and actionable by agents through Multica, not stuck in a Delphi-private
  store. This is also the read path backing Auriga's TrackerAdapter where
  applicable (see auriga-tracker-reader).

acceptance_criteria:
  - "Given the operator approves, comments on, or edits a decision in Delphi, when the action is submitted, then it is written to Multica's comment/decision model, not a Delphi-private store."
  - "Given an agent (via Multica) picks up a comment/decision Delphi wrote, when it acts on it, then Delphi reflects the resulting state change on next read."
  - "Given Multica is unreachable, when the operator attempts a write, then Delphi surfaces a clear failure rather than silently dropping the action or falsely reporting success."

steps:
  - id: research
    description: Spike against Multica's actual self-hosted API (~/Code/multica) to confirm the exact comment/decision payload shape — flagged as an open architecture risk, not yet field-verified beyond the README/CLI docs.
    agent: researcher
  - id: test-spec
    description: Write failing tests for comment/decision write, read-back reflecting agent-driven state changes, and unreachable-Multica error surfacing.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the Multica Client (REST + WebSocket) to make failing tests pass.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness and convention compliance.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/delphi
  tech_stack:
    backend: node+typescript (fastify)
    realtime: websocket
  key_files:
    - path: /Users/mdostal/Code/multica/CLI_AND_DAEMON.md
      purpose: Documents the self-hosted server-url/api pattern (`multica setup self-host --server-url https://api.example.com ...`) this client targets.

files_to_modify:
  - file: server/adapters/multica/client.ts
    change: Create — REST client for comment/decision read-write.
  - file: server/adapters/multica/socket.ts
    change: Create — WebSocket subscription for real-time updates.
  - file: server/db/migrate.ts
    change: Extend — add multica_comment_id column reference used by comments table (added in comment-thread-ui).

code_examples:
  - title: Multica's self-hosted API pattern
    file: /Users/mdostal/Code/multica/CLI_AND_DAEMON.md
    snippet: |
      multica setup self-host --server-url https://api.example.com --app-url https://app.example.com
      multica config set server_url https://api.example.com
      # API requests use a default timeout of 30 seconds.

design_decisions:
  - decision: Multica Client is REST for reads/writes, WebSocket for live updates.
    rationale: Matches Multica's own documented pattern (README advertises real-time progress streaming via WebSocket) — architecture.md consistency choice.

cross_cutting:
  - concern: documentation
    action: "Add 'Multica Client' to CONTEXT.md Key paths, and cross-reference Multica's self-hosting docs as a canonical reference."

risks:
  - severity: high
    description: architecture.md flags this exact gap — "REQ-04/REQ-07 assume Multica's comment model maps cleanly onto comments.multica_comment_id; a short spike... should confirm the exact payload shape before REQ-07 implementation begins."
    mitigation: The research step above is that spike — implementation must not proceed past test-spec until the spike confirms the real payload shape.

