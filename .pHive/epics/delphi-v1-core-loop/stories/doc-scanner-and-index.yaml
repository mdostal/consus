id: doc-scanner-and-index
epic: delphi-v1-core-loop
title: Doc Scanner — index generated docs by repo/epic/phase
status: pending
complexity: medium
methodology: tdd
depends_on: [delphi-project-scaffold]
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Implement REQ-03's backend half: a filesystem walker that scans configured
  repos' `.pHive/planning/` and `docs/` for generated `.md`/`.html` artifacts,
  indexes them into the `doc_index` table (repo, epic, phase, file_path,
  content_hash, last_scanned_at), and exposes a read API. No rendering UI in
  this story — that's doc-browser-ui, which depends on this one.

acceptance_criteria:
  - "Given a repo has `.pHive/planning/*.md` files, when the Doc Scanner runs, then each file is indexed with its repo/epic/phase derived from path structure."
  - "Given a doc changes on disk after the last scan, when the scanner re-runs, then `content_hash` changes and `last_scanned_at` updates — new docs since last read are detectable via this diff (REQ-03 acceptance: 'new doc appears without a manual pull step')."
  - "Given the doc_index API is queried by repo, when called, then results are grouped repo → epic → phase, matching architecture.md's browse hierarchy."
  - "Given a `.md` or `.html` file, when the API returns its content, then it is the raw content plus a `format` field so the frontend knows how to render it — no server-side markdown-to-HTML conversion in this story (kept for doc-browser-ui)."

steps:
  - id: research
    description: Confirm the shape of existing .pHive/planning/*.md docs (this repo's own planning docs) and .pHive/epics/*/docs/ as the canonical scan targets.
    agent: researcher
  - id: test-spec
    description: Write failing tests for scan indexing, idempotent re-scan, content-hash change detection, and the grouped-query API.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the Doc Scanner and doc_index API to make the failing tests pass.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness and convention compliance.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/delphi
  tech_stack:
    backend: node+typescript (fastify)
    database: sqlite
  key_files:
    - path: .pHive/planning/architecture.md
      purpose: Defines the doc_index table shape (repo, epic, phase, file_path, content_hash, last_scanned_at) — REQ-03.

files_to_modify:
  - file: server/adapters/doc-scanner/index.ts
    change: Create — filesystem walker + doc_index writer.
  - file: server/db/migrate.ts
    change: Extend — add doc_index table.
  - file: server/routes/docs.ts
    change: Create — GET endpoint returning docs grouped by repo/epic/phase.

code_examples: []  # No reference implementation on disk yet — follows delphi-project-scaffold's server/adapters convention once it lands.

design_decisions:
  - decision: Doc Scanner is read-only and disk-driven — no write-back to source repos.
    rationale: REQ-03 is a browse/render requirement; Delphi surfaces docs, it doesn't own them.

cross_cutting:
  - concern: documentation
    action: "Add 'Doc Scanner' and 'doc_index' as CONTEXT.md Terminology entries once implemented — new domain vocabulary."

risks:
  - severity: low
    description: Scanning arbitrary configured repos' filesystems requires a config surface (which repos to scan) not yet specified.
    mitigation: Scope v1 to a single configured repo list in a local config file; multi-repo config UX is not blocking for REQ-03's acceptance criteria.

references:
  - path: .pHive/planning/prd.md
    relevant_excerpt: |
      REQ-03: Generated-Doc Browse & Render — browse and render generated docs
      (briefs, PRDs, architecture, plans, CBAs, specs) by repo / epic / phase.
