    database: sqlite
  key_files:
    - path: docs/prior-art.md
      purpose: "§1 and §3 LIFT #2 — the only local description of decision-request/v1's shape; the real source is remote."

files_to_modify:
  - file: server/decision-contract/parser.ts
    change: Create — decision_payload parse/serialize + AnswerShape resolution.
  - file: server/db/migrate.ts
    change: Extend — add decision_payload JSON column to items.

code_examples: []  # Real reference (decision-request.ts) is remote and unfetched — see Risks.

design_decisions:
  - decision: decision_payload is additive on items, not a schema fork.
    rationale: architecture.md Key Decisions #6 — items without a payload keep working unchanged.

cross_cutting:
  - concern: documentation
    action: "Add 'decision-request/v1', 'decision_payload', 'AnswerShape' to CONTEXT.md Terminology — core new domain vocabulary discovered via prior-art.md."

risks:
  - severity: high
    description: The real decision-request.ts source was not fetched during planning; building purely from prior-art.md's summary risks drifting from the actual proven shape prior-art.md explicitly says to port "nearly verbatim."
    mitigation: research step requires fetching the real file before test-spec; if SSH access fails, escalate rather than guess.

references:
