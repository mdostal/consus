id: votem-quorum-router
epic: delphi-v1-core-loop
title: votem Quorum Router — hand off quorum-scoped decisions (REQ-14)
status: pending
complexity: medium
methodology: tdd
depends_on: [vesta-policy-adapter]

description: |
  Implement REQ-14: when vesta-policy-adapter resolves an item's policy to
  "quorum," hand the item to votem and display votem's resulting state
  (including any recorded tiebreak) rather than Delphi implementing its own
  voting. No local votem repo/spec exists (confirmed during this
  reconciliation) — same adapter-first, schema-pending treatment as Vesta
  and Auriga.

acceptance_criteria:
  - "Given Vesta's policy resolves to 'quorum' for an item, when Delphi processes it, then it hands the item to votem and displays votem's resulting state rather than running its own vote."
  - "Given votem is unreachable, when a quorum-routed item is processed, then Delphi surfaces a clear 'quorum unavailable' state rather than silently falling back to a direct human decision that bypasses the configured policy."

steps:
  - id: research
    description: Confirm the Vesta Policy Adapter's 'quorum' resolution shape from vesta-policy-adapter; confirm no local votem repo/spec exists (re-verify at execution time).
    agent: researcher
  - id: test-spec
    description: Write failing tests for quorum hand-off, result display, and unreachable-votem error surfacing.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the votem Router to make failing tests pass, wiring the real transport if votem is confirmed reachable, else the documented unavailable-state fallback.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness, confirming Delphi never implements its own voting logic.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/delphi
  tech_stack:
    backend: node+typescript (fastify)
  key_files:
    - path: docs/prior-art.md
      purpose: "§2 — 'votem is the MECHANISM Delphi routes to when policy says quorum.' No votem repo exists to verify against."

files_to_modify:
  - file: server/adapters/votem/router.ts
    change: Create — hand-off client + result display, no voting logic.

code_examples:
  - title: Vesta Policy Adapter's adapter-first pattern to follow
    file: server/adapters/vesta/policy-reader.ts
    snippet: |
      # Established by vesta-policy-adapter — votem router follows the same
      # adapter-first-schema-pending pattern.

design_decisions:
  - decision: Delphi never implements quorum voting itself — hand-off + display only.
    rationale: prior-art.md — "votem is the MECHANISM Delphi routes to," keeping Delphi a surface, not a policy engine.

cross_cutting:
  - concern: documentation
    action: "Add 'votem', 'quorum routing' to CONTEXT.md Terminology."

risks:
  - severity: medium
    description: No local votem repo/spec exists as of this reconciliation.
    mitigation: Adapter-first implementation against REQ-14's behavioral contract; real schema wired once votem is reachable. Lower severity than Vesta/Auriga since quorum routing is a narrower, more isolated code path.

references:
  - path: docs/prior-art.md
    relevant_excerpt: |
      votem is the MECHANISM Delphi routes to when policy says "quorum."
      Plugins just EMIT "this needs a decision" and DEFER — they never own
      the mode.
