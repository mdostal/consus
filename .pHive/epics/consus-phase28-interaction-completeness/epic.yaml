  matched_tags: [interaction-design, decision-board, diagram-editor, doc-scanning]
  roster: [orchestrator]
  per_tag_reasoning:
    interaction-design: "Grounded in a live, file-cited research pass (fork agent) over the real classifier/parser/AnswerControl/DiagramCanvas/attachments code before any design work -- single-pass design discussion + direct story decomposition, proportionate to a medium-scope set of independent vertical slices."
  confidence: high
  gate_decisions:
    hv_planning: skipped
    structured_outline: skipped
    reason: "Medium scope -- four independently-scoped vertical slices, each reusing an existing mechanism, no cross-slice sequencing. The slices in design-discussion.md §2 already are the vertical plan."

