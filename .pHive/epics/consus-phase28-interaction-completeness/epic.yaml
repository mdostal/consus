name: consus-phase28-interaction-completeness
title: Decision/survey interaction completeness, wireframe visibility, rendered diffs
description: >
  Deep-dive gap analysis against VISION.md and the original ask, grounded in
  a live research pass (docs/research-brief.md) that also caught and fixed a
  real dev/main divergence: main had accrued a mature decisions/survey
  feature stream (SurveyView, survey grouping, feature-selection/v1,
  attachments, research sections) via direct-to-main PRs that never flowed
  through dev, now reconciled. This epic closes four confirmed, independent
  gaps, each reusing an existing proven mechanism: attachment image preview
  (backend already correct, frontend never renders it), rendered visual
  diffs for docs+diagrams (data already computed everywhere, never
  displayed), .pHive/design/ wireframe scanning (mirrors phase27's
  overview-scan pattern), and completed/new answer shapes (edit, cba,
  free-text, rating, ranking) via the same parser->AnswerControl->verdict
  pattern already proven twice. True sequential/gated survey stepping and
  Consus-native quorum are explicitly deferred (see design-discussion.md
  §3) -- quorum in particular is scoped as a future external middle-layer
  approval API, not an in-app feature, per explicit user direction.
target_codebase: /Users/mdostal/Documents/work/pantheon/consus
methodology: classic
version_bump: minor
sidecar_retention: committed

git_flow:
  base_branch: dev
  branch_strategy: per-epic

