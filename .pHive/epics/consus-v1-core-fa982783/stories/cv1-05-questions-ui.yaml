design_decisions:
  - decision: Answer textarea per row, not modal
    rationale: Simpler UX for answering multiple questions in sequence
  - decision: Question removed from list after answer (optimistic UI)
    rationale: Immediate feedback; question is resolved, no longer relevant to inbox
  - decision: Actor hardcoded to 'mathew' for v1
    rationale: Single-operator v1, no login system yet

risks:
  - severity: low
    description: Large question list might not paginate
    mitigation: v1 assumes <20 questions; add pagination in v2 if needed
  - severity: low
    description: Answer submission fails but question is removed from UI
    mitigation: Add error handling to re-fetch on POST failure

