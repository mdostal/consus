design_decisions:
  - decision: Full doc content in issue body, not diff
    rationale: Hive planner needs full context; it's the planner's job to decompose
  - decision: Labels hive:doc-driven + hive:repo:<target>
    rationale: hive:doc-driven signals doc-driven flow, hive:repo scopes to correct codebase
  - decision: Title derived from file path if not provided
    rationale: design-discussion.md → "Design Discussion" is sensible default
  - decision: fired_tickets table for audit log
    rationale: Tracks which edits were fired, when, by whom — needed for history view

