design_decisions:
  - decision: Read-only view, no actions
    rationale: Audit log only; user can click through to Multica for ticket status
  - decision: Join fired_tickets with doc_edits to show doc path
    rationale: Ticket ID alone is opaque; doc path gives context

risks:
  - severity: low
    description: Large history might not paginate
    mitigation: v1 assumes <100 fires; add pagination v2 if needed

