design_decisions:
  - decision: Plain textarea, no markdown preview
    rationale: MVP simplicity; preview is v2 feature
  - decision: Fire button disabled until save completes
    rationale: Need edit_id from save before fire can succeed
  - decision: Ticket URL shown in success message
    rationale: User needs to verify ticket was created in Multica

risks:
  - severity: low
    description: Large doc content might make textarea sluggish
    mitigation: Current docs are <10KB; acceptable for v1
  - severity: low
    description: User edits, forgets to save, navigates away (lost changes)
    mitigation: Add beforeunload warning if content changed and not saved (v2)

