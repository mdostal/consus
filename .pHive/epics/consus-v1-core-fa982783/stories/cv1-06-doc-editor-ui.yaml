id: cv1-06-doc-editor-ui
epic: consus-v1-core-fa982783
title: Build doc editor UI (edit, save, fire)
status: pending
complexity: medium
methodology: tdd
depends_on: [cv1-03-doc-edit-api, cv1-04-fire-ticket-api]

description: |
  Create React views for editing living docs:
  - Add "Edit" button to doc list view (/docs)
  - Editor route: /docs/:repo/:path/edit
  - Markdown textarea with Save and Fire buttons
  - Save writes to SQLite (optionally to disk via checkbox)
  - Fire creates Multica ticket, shows success with ticket URL

acceptance_criteria:
  - "Given: Viewing /docs list
     When: Click Edit button on a doc
     Then: Navigates to /docs/:repo/:path/edit with doc content loaded"
  - "Given: On editor page
     When: Modify content and click Save
     Then: PUTs to /api/docs/content, shows 'Saved' confirmation"
  - "Given: Saved edit exists
     When: Click Fire button
     Then: POSTs to /api/docs/:edit_id/fire, shows ticket URL"
  - "Given: commit_to_disk checkbox checked
     When: Save clicked
     Then: Sends commit_to_disk=true in PUT request"

steps:
  - id: research
    description: Review existing doc list view, check React Router patterns for nested routes
    agent: researcher
  - id: test-spec
    description: |
      Write component tests for DocEditorView (web/src/views/DocEditorView.test.tsx):
      - Renders loading state while fetching doc content
      - Fetches doc via GET /api/docs/content?repo=...&path=...
      - Textarea displays fetched content
      - Save button calls PUT /api/docs/content with modified text
      - commit_to_disk checkbox controls request payload
      - Fire button calls POST /api/docs/:edit_id/fire
      - Success message shows ticket URL after fire
      - Error states for fetch/save/fire failures

      Update DocListView tests (add Edit button rendering)
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Create web/src/views/DocEditorView.tsx:

      import { useState, useEffect } from 'react';
      import { useParams, useNavigate } from 'react-router-dom';

      export function DocEditorView() {
        const { repo, '*': path } = useParams();  // Catch-all for path with slashes
        const [content, setContent] = useState('');
        const [loading, setLoading] = useState(true);
        const [editId, setEditId] = useState<string | null>(null);
        const [commitToDisk, setCommitToDisk] = useState(false);
        const [ticketUrl, setTicketUrl] = useState<string | null>(null);

        useEffect(() => {
          fetchContent();
        }, [repo, path]);

        async function fetchContent() {
          const res = await fetch(`/api/docs/content?repo=${repo}&path=${path}`);
          const data = await res.json();
          setContent(data.content);
          setLoading(false);
        }

        async function saveEdit() {
          const res = await fetch('/api/docs/content', {
            method: 'PUT',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({repo, path, content, commit_to_disk: commitToDisk}),
          });
          const data = await res.json();
          setEditId(data.edit_id);
          alert('Saved!');
        }

        async function fireTicket() {
          if (!editId) {alert('Save first!'); return;}
          const res = await fetch(`/api/docs/${editId}/fire`, {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({target_repo: repo, actor: 'mathew'}),
          });
          const data = await res.json();
          setTicketUrl(data.ticket_url);
        }

        if (loading) return <div>Loading...</div>;

        return (
          <div className="doc-editor">
            <h1>Edit {path}</h1>
            <textarea
              value={content}
              onChange={e => setContent(e.target.value)}
              rows={30}
              style={{width: '100%'}}
            />
            <div className="controls">
              <label>
                <input type="checkbox" checked={commitToDisk} onChange={e => setCommitToDisk(e.target.checked)} />
                Commit to disk
              </label>
              <button onClick={saveEdit}>Save</button>
              <button onClick={fireTicket} disabled={!editId}>Fire</button>
            </div>
            {ticketUrl && <div className="success">Ticket created: <a href={ticketUrl}>{ticketUrl}</a></div>}
          </div>
        );
      }

      Update web/src/views/DocListView.tsx (or equivalent):
      - Add "Edit" button/link per doc row
      - Link to `/docs/${repo}/${encodeURIComponent(doc.file_path)}/edit`

      Update web/src/App.tsx:
      <Route path="/docs/:repo/*" element={<DocEditorView />} />
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Verify:
      - Doc path with slashes (e.g., .pHive/epics/xyz/docs/design.md) routes correctly
      - Save before fire is enforced (fire button disabled until editId set)
      - commit_to_disk checkbox state persists during save
      - Ticket URL link is clickable
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit doc editor UI
    agent: developer
    depends_on: [review]

