id: cv1-02-questions-api
epic: consus-v1-core-fa982783
title: Implement questions API (create, list, answer)
status: pending
complexity: medium
methodology: tdd
depends_on: [cv1-01-schema-migration]

description: |
  Implement three REST endpoints for the question-park → answer → resume flow:
  - POST /api/questions — Minerva calls this to park a blocking question
  - GET /api/questions — list open (unresolved) questions
  - POST /api/questions/:id/answer — human submits answer, resumes workflow

  Each endpoint integrates with Multica (create issue for question, write comment for answer)
  and local SQLite (persist question state, track resolution).

acceptance_criteria:
  - "POST /api/questions creates SQLite row + Multica issue with hive:question label"
  - "GET /api/questions returns only unresolved questions (resolved=0)"
  - "POST /api/questions/:id/answer writes Multica comment, marks question resolved, returns comment_id"
  - "404 if question ID not found or already resolved"
  - "503 if Multica unavailable"

steps:
  - id: research
    description: Review existing decisions.ts route pattern for Multica integration
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for questions routes (server/routes/questions.test.ts):
      - POST /api/questions with valid payload creates row + Multica issue
      - POST /api/questions without required fields returns 400
      - GET /api/questions returns only resolved=0 rows
      - POST /api/questions/:id/answer with valid answer writes comment + resolves
      - POST /api/questions/:id/answer on already-resolved question returns 400
      - Multica client errors surface as 503
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Create server/routes/questions.ts with three route handlers:

      1. POST /api/questions
         - Validate body (agent_id, agent_name, question required)
         - Generate question ID
         - Insert into parked_questions table
         - Create Multica issue via client.createIssue({
             title: `[Question] ${truncate(question, 80)}`,
             description: question body with context + agent info,
             labels: ['hive:question']
           })
         - Store multica_issue_id in row
         - Return {question_id, multica_issue_id}

      2. GET /api/questions
         - SELECT * FROM parked_questions WHERE resolved=0 ORDER BY created_at ASC
         - Return array of question objects

      3. POST /api/questions/:id/answer
         - Validate body (answer required, actor optional)
         - Fetch question row, return 400 if resolved=1
         - Write Multica comment via writeCommentAndCache (reuse from decisions.ts)
         - UPDATE parked_questions SET resolved=1, answer=?, answered_by=?, answered_at=? WHERE id=?
         - If callback_url present, optionally POST to it (nice-to-have, not blocking)
         - Return {ok: true, comment_id}

      Register routes in server/index.ts alongside existing decision routes.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Verify:
      - Error handling matches decisions.ts pattern
      - Multica client reuse is correct
      - Tests cover happy path + error cases
      - Question lifecycle (create → list → answer → no longer listed) works
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit questions API implementation
    agent: developer
    depends_on: [review]

