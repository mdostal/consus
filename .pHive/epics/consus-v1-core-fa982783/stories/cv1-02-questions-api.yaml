code_examples:
  - title: Multica comment write pattern
    file: server/routes/decisions.ts
    snippet: |
      const commentResult = await writeCommentAndCache(db, client, {
        itemId: issue.id,
        cacheItemId: localItem.itemId,
        author: actor,
        body: commentBody,
      });
      if (!commentResult.ok) {
        reply.code(502);
        return { error: `Multica comment write failed: ${commentResult.error}` };
      }

  - title: Route registration pattern
    file: server/index.ts
    snippet: |
      import { registerDecisionRoutes } from "./routes/decisions.js";
      // ...
      registerDecisionRoutes(app, { db, client, decisionLogPath });

design_decisions:
  - decision: Reuse writeCommentAndCache from decisions.ts for answer comments
    rationale: Same Multica integration pattern, already tested, caches comment_id locally
  - decision: Questions have separate table, not items table
    rationale: Different lifecycle and fields (parked_workflow_id, callback_url)
  - decision: callback_url POST is optional/best-effort
    rationale: v1 uses polling, callback is optimization — don't block answer on callback failure

risks:
  - severity: medium
    description: Multica issue create might fail (network, auth, rate limit)
    mitigation: Return 503 with error message, question row still created for retry
  - severity: low
    description: Answer comment write succeeds but SQLite update fails
    mitigation: Wrap in transaction if supported, or accept eventual consistency (comment exists, row updated on retry)

references:
