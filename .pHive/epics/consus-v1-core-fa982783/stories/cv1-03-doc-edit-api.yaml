design_decisions:
  - decision: Content hash dedup to prevent duplicate edits
    rationale: Human might hit Save multiple times; single edit row per unique content
  - decision: Path validation restricts edits to .pHive/epics/
    rationale: Safety — prevent arbitrary file writes outside doc directory
  - decision: GET returns source field (edit vs disk)
    rationale: UI can show "Unsaved changes" indicator if source=edit

risks:
  - severity: medium
    description: Disk write fails but SQLite row succeeds (commit_to_disk=true)
    mitigation: Log error, return committed=false; user can retry or fire without disk commit
  - severity: low
    description: Large doc content (>1MB) might hit SQLite blob limits
    mitigation: SQLite TEXT has no practical limit; if issue arises, add size check in validation

