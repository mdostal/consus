git_flow:
  base_branch: main
  branch_strategy: per-epic

description: |
  Implement the two foundational flows for Consus v1:
  1. Minerva question-park → Consus answer → resume (async clarification loop)
  2. Editable docs → fire ticket (doc-drives-build loop)

  Both flows leverage existing Multica integration and hive plugin ticket mechanism.

