design_decisions:
  - decision: "v1 supports Claude Code only — no Codex CLI or other harness detection."
    rationale: "skills/consus/SKILL.md is already explicitly scoped to Claude-Code-compatible harnesses, and Claude Code's file-drop skill convention is a real, confirmed mechanism on this machine. Codex's own mechanism hasn't been researched; guessing at it risks a non-functional install step. See design-discussion.md."
  - decision: "No MCP server registration step — Consus has no MCP server and none is proposed here."
    rationale: "Unlike Portunus (an MCP-integrated tool), Consus's agent-facing surface is a plain REST API plus a documented skill file. The entire 'install' action is the skill-file drop; there is nothing else to register."
  - decision: "Detection is a filesystem check (~/.claude/ existing), not shelling out to the claude CLI."
    rationale: "The cited precedent's own build found that a naive `claude mcp list`-style call health-checks every registered MCP server (30+ seconds on a machine with many configured) — the equivalent trap here is invoking the CLI at all for a question a filesystem check answers just as well."
  - decision: "The install/status script takes a HOME-override mechanism so automated tests never touch the real operator machine."
    rationale: "This story's own acceptance criteria require exercising all four real states (absent/fresh/current/stale) — doing that against the real ~/.claude/ in CI or any other test run would be both unsafe and non-hermetic. The real, unoverridden path is still verified live as a manual step (see make-tests-pass)."

risks:
  - severity: medium
    description: "An idempotency bug that overwrites a hand-edited ~/.claude/skills/consus/SKILL.md without warning would be a real, if minor, surprise data loss for an operator who customized their local copy."
    mitigation: "Acceptance criteria require a real byte-level content comparison (not existence/mtime) before deciding install/no-op/update, and the script must report which case applied every time it writes."
  - severity: low
    description: "A banner that re-shows every session despite being dismissed would read as broken nag-ware, undermining the whole point of making it collapsible."
    mitigation: "Acceptance criteria explicitly require the collapse to survive a real reload (re-mount with the same localStorage), not just an in-memory dismiss."
