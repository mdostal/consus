    - path: web/src/App.tsx
      purpose: "Masthead is around line 1268-1294 (ThemeSkinPicker + CommandPalette mounted here); the new banner mounts directly below it, before <main> (~line 1296), so it's visible on every tab."
    - path: .pHive/epics/consus-phase19-agent-harness-onboarding/docs/design-discussion.md
      purpose: "Full reasoning for the Claude-Code-only v1 scope decision and the no-MCP-server-needed analysis — read before assuming this story should detect/support any other harness."

