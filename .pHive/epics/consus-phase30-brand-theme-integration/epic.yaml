    reason: "Medium scope -- four stories, mostly independent (skin tokens, masthead mark, icon regeneration, final QA pass), each reusing an existing proven pattern (the 3-state skin CSS pattern, the confirmed prior icon-gen mechanism) rather than inventing new architecture."

