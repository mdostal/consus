name: consus-phase30-brand-theme-integration
title: Wire the approved Consus brand into the real product -- a new skin, real icons, a real mark
description: >
  Closes the gap the operator named directly right after consus-phase29
  shipped: the brand work so far produced approved artifacts (a decided
  in-app decision, a brand guide, a branding/ folder) but none of it is
  actually applied anywhere in the running product. This epic adds a 4th
  skin ("Granary") built from the real approved palette (Granary Indigo,
  Threshing Gold, Quern Charcoal, Parchment) and typography (Fraunces
  display / IBM Plex Sans body, self-hosted -- Consus loads zero webfonts
  today and stays local-first by explicit project policy), made the default
  for fresh installs only (an existing install's stored skin preference is
  never silently overridden); replaces the placeholder "◈" masthead glyph
  with the real Abstract Mark concept, scoped to the Granary skin only (the
  other 3 skins keep their own fully-realized decorative identities
  untouched); regenerates the desktop app's icon set and adds a real web
  favicon from that same Abstract Mark, replacing the old hub-and-spoke
  placeholder the brand guide's own text names as due for replacement; and
  closes with a real, iterated visual-verification pass across every major
  UI surface (not just a token swap) per the operator's explicit "go back
  and forth... ensure it is done well" quality bar.
target_codebase: /Users/mdostal/Documents/work/pantheon/consus
