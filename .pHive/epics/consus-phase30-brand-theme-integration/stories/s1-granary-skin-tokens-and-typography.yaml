files_to_modify:
  - file: web/src/theme/tokens.css
    change: Add [data-skin="granary"] light+dark rule blocks (3-state pattern) plus --consus-font-display token
  - file: web/src/theme/useSkinPreference.ts
    change: Add "granary" to SkinPreference union + isSkinPreference guard; set DEFAULT_SKIN="granary"
  - file: web/src/theme/ThemeSkinPicker.tsx
    change: Add Granary to SKIN_OPTIONS
  - file: web/index.html
    change: Extend inline bootstrap script's valid-skin check to recognize "granary"
  - file: web/public/fonts/ (new)
    change: Self-hosted Fraunces + IBM Plex Sans woff2 files (400/500/600/700 weights)

design_decisions:
  - decision: Granary becomes DEFAULT_SKIN, but only for installs with no stored preference
    rationale: "An existing operator's chosen skin must never silently change on upgrade -- useSkinPreference already reads localStorage before falling back to DEFAULT_SKIN, so this is a one-constant change plus a regression test proving the non-override guarantee, not new logic"
  - decision: Self-host fonts rather than a Google Fonts CDN link
    rationale: "Consus is explicitly local-first / no-network-by-default (VISION.md Fixed Boundaries) -- a runtime CDN font fetch would be the first external network dependency the rendered UI has ever had"
  - decision: No bespoke decorative component for Granary in this story
    rationale: "Brand personality statement is explicitly 'confidence through clarity, not decoration' -- ship clean, revisit only if the operator wants ornamentation after seeing it live"

references:
  - path: .pHive/brand/brand-system.yaml
    relevant_excerpt: |
      colors: primary Granary Indigo #362B6B, secondary Threshing Gold #9C6316,
      neutral Quern Charcoal #46414F, surface Parchment #FAF7F0.
      typography: heading_font Fraunces, body_font IBM Plex Sans, weights
      400/500/600/700.
