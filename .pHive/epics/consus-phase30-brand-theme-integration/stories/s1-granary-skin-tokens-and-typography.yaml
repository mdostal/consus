id: s1-granary-skin-tokens-and-typography
epic: consus-phase30-brand-theme-integration
title: Add the Granary skin (brand palette + typography), default for fresh installs only
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Confirmed via direct research: web/src/theme/tokens.css defines exactly 3 skins
  (drafting/case-board/harness), each a [data-skin="..."] block repeated 3 ways
  (bare block, @media prefers-color-scheme:dark guarded, explicit
  [data-theme="dark"]) over a fixed 9-color + 3-font + 2-shape token set. Skin
  registration touches useSkinPreference.ts (SkinPreference union,
  isSkinPreference guard, DEFAULT_SKIN, localStorage SKIN_STORAGE_KEY),
  ThemeSkinPicker.tsx (hardcoded SKIN_OPTIONS array), and web/index.html's
  inline bootstrap <script> (hardcodes the "case-board"||"harness" fallback
  check -- must be extended or Granary flashes to drafting pre-hydration).

  This story adds a 4th skin, "granary", built from the already-approved
  .pHive/brand/brand-system.yaml palette (Granary Indigo #362B6B, Threshing
  Gold #9C6316, Quern Charcoal #46414F neutral, Parchment #FAF7F0 surface) and
  typography (Fraunces display / IBM Plex Sans body). brand-system.yaml
  defines only ONE palette -- a real dark companion must be derived (bg as a
  dark tint of the indigo accent, not a generic dark grey; ink as a warm
  parchment-tinted off-white; accent brightened for dark-background contrast),
  following the exact relationship the other 3 skins already use between
  their light and dark variants. Verify computed contrast ratios (ink-on-bg,
  accent-on-bg) meet at least 4.5:1 for body text in both light and dark --
  brand-system.yaml's raw hexes were not authored against WCAG ratios.

  No webfont loading exists anywhere in this codebase today (confirmed: zero
  @font-face, zero <link> tags, pure system-font-stack CSS vars). Fraunces and
  IBM Plex Sans are both SIL Open Font License -- self-host the font files as
  static assets (subset to the 4 weights brand-system.yaml documents using:
  400/500/600/700, woff2 only) via @font-face, consistent with Consus's own
  "local-first, no network dependency by default" policy (VISION.md Fixed
  Boundaries) -- do NOT fetch from Google Fonts CDN at runtime. The existing
  token set has no display/body font split (no other skin needs one) -- add a
  new --consus-font-display token, additive only; the other 3 skins simply
  never set it.

  DEFAULT_SKIN changes to "granary", but useSkinPreference only ever consults
  that constant when localStorage has no stored preference -- an existing
  install's current skin choice must keep winning, unchanged. This is the
  single most important behavioral guarantee of this story: nobody's skin
  silently changes on upgrade.

  Shape tokens (--consus-radius-scale, --consus-edge-style) must be a value
  distinct from all 3 existing skins (not Drafting's sharp 0.2, not Case
  Board's organic 1.3) -- brand personality is "precise, trustworthy,
  unshowy" (brand-system.yaml's personality.tone), so lean toward a moderate,
  confident radius with straight edges, not organic/sketchy.

  Granary does NOT get a bespoke decorative skin component (no
  GranarySkinBackdrop.tsx) in this story -- ship clean/minimal, consistent
  with "confidence through clarity, not decoration" (brand-system.yaml's own
  voice_principles). A decorative pass is an explicit, separate future item
  if wanted after seeing it live.

acceptance_criteria:
  - "Given the skin picker (ThemeSkinPicker.tsx), a 4th option 'Granary' is selectable alongside Drafting Table / Case Board / Harness"
  - "Given a fresh install with no stored skin preference, the app renders Granary by default (light and dark/system all verified)"
  - "Given an EXISTING install with a stored skin preference (drafting/case-board/harness) in localStorage, upgrading to this build does NOT change their active skin -- a regression test asserts this exact non-override behavior"
  - "Given [data-skin=\"granary\"] in light mode, computed contrast ratio of --consus-ink against --consus-bg is >= 4.5:1"
  - "Given [data-skin=\"granary\"][data-theme=\"dark\"] (and the prefers-color-scheme:dark-guarded equivalent), computed contrast ratio of --consus-ink against --consus-bg is >= 4.5:1, and the dark palette is a real derived companion (not a literal color-inversion of the light palette)"
  - "Given Fraunces/IBM Plex Sans font files are bundled as static assets, they load via self-hosted @font-face -- zero network requests to any external font CDN, verified by checking network activity while Granary is active"
  - "Given web/index.html's inline bootstrap <script>, it correctly recognizes 'granary' as a valid stored skin value (not silently falling through to the 'drafting' default) so there is no flash-of-wrong-skin on load"
  - "Given the other 3 skins (drafting/case-board/harness), their CSS rule blocks, JS registration arrays, and computed rendering are byte-identical before and after this story -- zero regression, verified by existing skin-system tests still passing unmodified"

steps:
  - id: research
    description: Re-confirm tokens.css's exact 3-state pattern per skin, useSkinPreference.ts's DEFAULT_SKIN/localStorage logic, ThemeSkinPicker.tsx's SKIN_OPTIONS shape, and index.html's inline bootstrap script's skin-validation logic, as they stand right now on this branch.
    agent: researcher
  - id: implement
    description: Add [data-skin="granary"] to tokens.css (light+dark, all 3 pattern states) using brand-system.yaml's palette plus a derived dark companion; add --consus-font-display; bundle self-hosted Fraunces/IBM Plex Sans woff2 files + @font-face; register "granary" in useSkinPreference.ts's union/guard, set DEFAULT_SKIN="granary", update ThemeSkinPicker.tsx's SKIN_OPTIONS, update index.html's bootstrap script's valid-skin check.
    agent: developer
    depends_on: [research]
  - id: test
    description: Add/extend skin-system tests -- Granary selectable, fresh-install defaults to Granary, existing stored preference is never overridden, contrast-ratio checks for both light and dark Granary, font files load with zero external network requests, all 3 existing skins remain byte-identical.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the existing 3 skins are genuinely untouched (diff tokens.css's drafting/case-board/harness blocks against origin), confirm the default-skin-for-fresh-installs-only guarantee actually holds by reading useSkinPreference.ts's real logic (not just trusting the test), confirm no external font network calls.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/consus-phase30-brand-theme-integration.
    agent: developer
    depends_on: [review]

