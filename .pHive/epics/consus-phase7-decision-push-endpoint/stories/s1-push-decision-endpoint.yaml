design_decisions:
  - decision: "id is caller-supplied and required, not server-generated."
    rationale: "The calling agent/harness is the one that knows what counts as 'the same decision asked twice' for its own workflow — Consus can't infer that. See design-discussion.md."
  - decision: "A duplicate id is 409 Conflict, not a silent upsert."
    rationale: "Upserting would hide a real bug in the caller's own id scheme. A clear 409 lets the caller decide whether that's expected (catch and ignore) or a mistake."
  - decision: "No auth/token layer for this route."
    rationale: "Server binds 127.0.0.1 only, single-operator threat model — consistent with every other route in this codebase; none of them have auth either."

risks:
  - severity: low
    description: "A caller could push a decision_payload that passes structural validation but is semantically nonsensical (e.g. a recommended option that doesn't actually make sense given its own tradeoffs text)."
    mitigation: "Not fully preventable server-side — same trust boundary the existing decision-contract parser already accepts from doc-embedded fenced blocks. Structural validation (version, option count, recommended-matches-an-option) is the bar the rest of this codebase holds itself to."

