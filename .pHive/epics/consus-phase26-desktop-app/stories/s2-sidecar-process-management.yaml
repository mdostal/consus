code_examples:
  - title: "Heimdall's real health poll (adapt the path from /healthz to /health)"
    file: /Users/mdostal/Documents/work/pantheon/heimdall/app/src-tauri/src/sidecar.rs
    snippet: |
      const HEALTH_POLL_TIMEOUT: Duration = Duration::from_secs(30);
      const HEALTH_POLL_INTERVAL: Duration = Duration::from_millis(200);
      pub fn pick_free_port() -> u16 {
          let listener = TcpListener::bind("127.0.0.1:0").expect("failed to bind an ephemeral port");
          listener.local_addr().expect("listener has no local addr").port()
      }
  - title: "Heimdall's real idempotent kill_sidecar + double RunEvent handler"
    file: /Users/mdostal/Documents/work/pantheon/heimdall/app/src-tauri/src/lib.rs
    snippet: |
      fn kill_sidecar(app: &tauri::AppHandle) {
          let Some(state) = app.try_state::<SidecarState>() else { return; };
          let Ok(mut guard) = state.child.lock() else { return; };
          let Some(mut child) = guard.take() else { return; }; // idempotent
          if let Err(e) = child.kill() { log::error!("kill failed: {e}"); }
          let _ = child.wait();
      }
      // Confirmed live: Cmd+Q delivers RunEvent::Exit directly, WITHOUT a
      // preceding ExitRequested on this platform/build — handle both.
      if matches!(event, RunEvent::ExitRequested { .. } | RunEvent::Exit) {
          kill_sidecar(app_handle);
      }
  - title: "Consus's real health route (the one to actually poll)"
    file: server/index.ts
    snippet: |
      app.get("/health", async () => {
        const row = db.prepare("SELECT 1 AS ok").get() as { ok: number } | undefined;
        return { status: "ok", sqlite: row?.ok === 1 ? "connected" : "unreachable" };
      });

design_decisions:
  - decision: "Poll GET /health, not /healthz"
    rationale: "Heimdall's endpoint name does not carry over — verified directly against Consus's own server/index.ts this session. Copying the path string without checking would silently hang every launch on the 30s timeout."
  - decision: "No bundled Node runtime — spawn the operator's own installed node"
    rationale: "Same tradeoff Heimdall makes deliberately (targets one already-provisioned machine, not portable distribution) — consistent with this epic's non-goals (no public notarized release)."

risks:
  - severity: high
    description: "A stale sidecar process from a prior debug run squatting on a port, or never being killed on quit, silently accumulating background node processes — this session directly hit a variant of this bug (a leftover throwaway-server process from earlier verification work squatting on port 8722)"
    mitigation: "Free-port-per-launch avoids the collision; the live kill-and-verify-via-ps acceptance criterion is not optional — this must be checked with a real running process, not assumed from code review"
  - severity: medium
    description: "GUI-launched PATH capture failing silently, sidecar's own node process then unable to find something it shells out to"
    mitigation: "Ported verbatim from Heimdall's already-solved implementation, including its conservative fallback PATH"

