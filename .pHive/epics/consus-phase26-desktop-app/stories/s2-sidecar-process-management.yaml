id: s2-sidecar-process-management
epic: consus-phase26-desktop-app
title: Spawn, health-check, and cleanly kill the Consus server sidecar
status: pending
complexity: medium
methodology: classic
depends_on: [s1-desktop-app-scaffold-and-state]

description: |
  Port Heimdall's sidecar.rs pattern to Consus: spawn the staged
  dist-server/index.js as a plain `node` child process (no bundled Node
  runtime), capture the operator's real login-shell PATH (GUI-launched
  macOS processes get a near-empty PATH — a confirmed, real gotcha, not
  hypothetical, per Heimdall's own sidecar.rs header comment), pick a
  fresh OS-assigned free port instead of hardcoding 8722 (avoids
  colliding with anything else already running — this session hit
  exactly this problem with a stale leftover process squatting on 8722),
  and health-check via Consus's REAL endpoint before the window ever
  navigates to it.

  Critical correction from Heimdall's own pattern: Consus's health
  endpoint is `GET /health` (confirmed by reading server/index.ts this
  session), NOT `/healthz` like Heimdall's — do not copy that path
  string, verify it against the real route registration in
  server/index.ts (`app.get("/health", ...)`).

  Env vars set on the spawned process, all confirmed real (not guessed)
  against server/index.ts: PORT (the picked free port), CONSUS_DB_PATH,
  CONSUS_PROJECTS_CONFIG, CONSUS_ATTACHMENTS_DIR — all three pointed at
  s1's app_data_dir() (~/Library/Application Support/com.mdostal.consus/).
  HOST is left unset so it defaults to 127.0.0.1 (never set HOST=0.0.0.0
  here — that default exists for containerized deploys, not this app).

acceptance_criteria:
  - "Given the app launches, a node child process is spawned running dist-server/index.js from the staged resource dir, with PORT set to a freshly OS-assigned free port"
  - "Given the sidecar is starting, the app polls GET http://127.0.0.1:{port}/health until it returns {status:'ok', sqlite:'connected'} or a bounded timeout (30s, matching Heimdall's HEALTH_POLL_TIMEOUT) elapses"
  - "Given the health check times out, the placeholder window shows an explicit error state (not a browser connection-refused page) explaining node must be installed and on PATH"
  - "Given the health check succeeds, the window navigates to http://127.0.0.1:{port}"
  - "Given the app quits via any path (tray Quit, Cmd+Q, Dock), the sidecar child process is killed exactly once — verified live by checking `ps` for the child pid before and after quit, not just trusting the code compiles"
  - "Given the spawned process's environment, PATH is the operator's real captured login-shell PATH, not the near-empty GUI-launch default — verified live by having the sidecar itself successfully invoke something that requires a real PATH (or, if Consus's server never shells out to external CLIs, document that explicitly as why this still matters for the child's own node resolution)"

