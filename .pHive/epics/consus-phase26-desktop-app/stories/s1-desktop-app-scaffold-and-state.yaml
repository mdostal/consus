design_decisions:
  - decision: "Fresh app-local state under ~/Library/Application Support/com.mdostal.consus/, not this checkout's .pHive/"
    rationale: "Explicit operator decision (AskUserQuestion, this session) — the desktop app is a first-run-clean install, not a viewer bolted onto one developer's live decisions DB."
  - decision: "No real frontend bundle for Tauri's own webview — a static placeholder only, real UI comes from the sidecar's own served SPA"
    rationale: "Matches Heimdall exactly: Consus's dist-web/ is served BY the Node sidecar itself (server/index.ts already does this via @fastify/static), so Tauri's webview just navigates to the sidecar's URL once healthy (s2). Tauri's own frontendDist is only ever a loading placeholder."

risks:
  - severity: medium
    description: "Accidentally defaulting env vars to this checkout's .pHive/ paths (copy-paste from this session's own manual npm start invocation) instead of the fresh Application Support path"
    mitigation: "Acceptance criteria explicitly test that app_data_dir() never resolves inside the git checkout; reviewer step checks this directly"

