id: s1-desktop-app-scaffold-and-state
epic: consus-phase26-desktop-app
title: Tauri v2 project scaffold + app-local state env wiring
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Create the new app/src-tauri/ Tauri v2 project skeleton for Consus's
  desktop shell, adapted directly from Heimdall's real, shipped
  app/src-tauri/ (read at /Users/mdostal/Documents/work/pantheon/heimdall/app/src-tauri/
  this session — Cargo.toml, tauri.conf.json, main.rs, lib.rs, build.rs).
  This story lays the foundation everything else in the epic builds on:
  the crate itself, the base window/setup skeleton (sidecar spawn/tray
  wiring come in s2/s3), and the app-local state directory resolution
  that makes the desktop app use its OWN empty consus.sqlite / project
  registry rather than this git checkout's live .pHive/ data (explicit
  operator decision this session — do not point the desktop app at this
  checkout's real data).

  Consus's server already reads its config entirely from env vars
  (confirmed by reading server/index.ts this session) — this story's job
  is computing the right values and setting them before spawning the
  sidecar (the actual spawn is s2's job; this story defines the function
  that resolves the paths and exposes them for s2 to consume).

acceptance_criteria:
  - "Given a fresh checkout with no app/ directory, `cargo tauri build --debug` from app/src-tauri/ produces a running .app skeleton (window may show a placeholder — sidecar isn't wired until s2)"
  - "Given the app launches, a helper function (e.g. `app_data_dir()`) resolves ~/Library/Application Support/com.mdostal.consus/ and creates it if absent, without touching this git checkout's own .pHive/ directory"
  - "Given tauri.conf.json, productName is 'Consus', identifier is 'com.mdostal.consus', version matches root package.json's current version (0.12.0) exactly"
  - "Given Cargo.toml, the crate is named consus-desktop (following heimdall-desktop's naming convention) and pulls in the same tauri feature set Heimdall uses (tray-icon, image-png) plus tauri-plugin-log, tauri-plugin-single-instance, tauri-plugin-autostart, tauri-plugin-dialog — even though s2/s3 wire their actual usage, declaring them now avoids a second Cargo.toml-touching story later"

steps:
  - id: research
    description: Read Heimdall's app/src-tauri/ end-to-end (already done at plan time — re-verify nothing has changed) and Consus's own server/index.ts env-var contract.
    agent: researcher
  - id: implement
    description: Scaffold app/src-tauri/ (Cargo.toml, tauri.conf.json, build.rs, main.rs, lib.rs skeleton with app_data_dir() resolution), plus app/ package.json-less placeholder frontend dir if Tauri's build step requires one (check Heimdall's dist-placeholder/ pattern — it uses a static placeholder, not a real frontend build, since Consus's real UI is served by the sidecar itself, not by Tauri's own webview bundle).
    agent: developer
    depends_on: [research]
  - id: test
    description: Verify `cargo tauri build --debug` succeeds and produces a .app that launches to a placeholder window without crashing.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm app_data_dir() never resolves inside this git checkout, confirm version lockstep with package.json, confirm no accidental writes to this checkout's .pHive/.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/consus-phase26-desktop-app.
    agent: developer
    depends_on: [review]

