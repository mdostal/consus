code_examples:
  - title: "Existing GET /api/docs grouping logic to mirror (server/routes/docs.ts, already read this session)"
    file: server/routes/docs.ts
    snippet: |
      app.get<{ Querystring: { project?: string } }>("/api/docs", async (request) => {
        const { project } = request.query;
        const scopedRepos = project ? Object.keys(repos).filter((r) => r === project) : Object.keys(repos);
        const grouped: GroupedDocs = {};
        for (const repo of scopedRepos) {
          grouped[repo] = {};
          for (const row of queryDocIndex(db, repo)) {
            const phase = row.phase ?? "unphased";
            grouped[repo][phase] ??= [];
            grouped[repo][phase].push({ epic: row.epic, file_path: row.file_path, ... });
          }
        }
        return grouped;
      });

design_decisions:
  - decision: "New endpoint, not a breaking reshape of the existing GET /api/docs"
    rationale: "GET /api/docs's current shape may already be relied on elsewhere (or by external harnesses per Consus's agent-facing skill contract) — additive is safer than reshaping in place."

