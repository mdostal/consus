id: s2-feature-grouped-docs-api
epic: consus-phase27-feature-doc-review-ui
title: "GET /api/docs/features — reshape doc_index into per-epic + overview groups"
status: pending
complexity: low
methodology: classic
depends_on: [s1-repo-overview-doc-scanning]

description: |
  New read endpoint that reshapes the same doc_index data GET /api/docs
  already returns (server/routes/docs.ts:42-61's queryDocIndex loop) into
  the grouping the UI actually needs: one entry per feature (epic) with
  its doc count and doc list, plus a separate "overview" bucket sourced
  from s1's new phase='overview' rows. This is a reshape of an existing
  query, not a new data source — confirmed this session that doc_index
  already carries everything needed.

acceptance_criteria:
  - "Given GET /api/docs/features?project=<repo>, the response shape is { features: [{epic, docCount, docs: [...]}], overview: [...doc rows with phase='overview'] }"
  - "Given a repo with docs across multiple epics, features[] has one entry per distinct non-null epic value, each with its own docs array (same per-doc fields GET /api/docs already returns: file_path, content_hash, last_scanned_at)"
  - "Given no project query param, results are scoped across every currently-registered repo (same scoping convention as the existing GET /api/docs endpoint's project= param, confirmed in server/routes/docs.ts:42-44)"
  - "Given this repo's own real data (post s1), calling this endpoint against consus returns a real, non-empty overview[] array containing README.md/VISION.md — verified with a real curl call against a running dev server, not just a mocked test"

