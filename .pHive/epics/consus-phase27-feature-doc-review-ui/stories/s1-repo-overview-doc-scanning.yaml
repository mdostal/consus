files_to_modify:
  - file: server/adapters/doc-scanner/index.ts
    change: Add repo-root README.md/VISION.md/docs/**/*.md as a third scan root, tagged phase="overview", epic=null

design_decisions:
  - decision: "New reserved phase value 'overview', not reusing 'planning'"
    rationale: "'planning' already means .pHive/planning/* specifically — confirmed by reading deriveEpicAndPhase() this session; conflating the two would make the existing planning-docs view show unrelated repo-meta content mixed in."

risks:
