    description: "A repo without README.md/VISION.md/docs/ (edge case) should not error the scan"
    mitigation: "Follow the existing tolerant-existsSync convention already used elsewhere in this codebase (e.g. project-registry.ts, server/index.ts's WEB_ROOT check)"

