id: kb-backlog-full-crud
epic: consus-v1-core-loop
title: "[P1 stretch] KB Backlog — full browse + edit + chat"
status: pending
complexity: high
methodology: bdd
depends_on: [kb-decide-ui]

description: |
  Implement REQ-09 (P1 stretch, may slip to v2 per Product Brief): the
  complete KB backlog experience — filter/search across all entries (not
  just recently-decided ones), and direct editing outside the comment flow,
  versioned per REQ-08's audit requirements. Explicit scope note: if
  implementation time threatens REQ-01 through REQ-08, this is the first
  story to slip to v2.

acceptance_criteria:
  - "Given the KB store exists, when the operator browses the backlog, then they can filter/search across all entries, not just recently-decided ones."
  - "Given a KB entry, when the operator edits it directly (outside the comment flow), then the edit is versioned per REQ-08's audit requirements."

steps:
  - id: research
    description: Confirm the kb_entries/kb_versions API from kb-store-schema-and-decide-api and the KB browser UI patterns from kb-decide-ui.
    agent: researcher
  - id: behavior-spec
    description: Write Given/When/Then specs for backlog filter/search and direct versioned edit, derived from this story's acceptance criteria.
    agent: tester
    depends_on: [research]
  - id: ui-design
    description: Delegate to /design for wireframes (atomic external call; see skills/design/SKILL.md). Deferred — not run live during this /plan session; run /design against this story before /execute.
    agent: ui-designer
    delegates_to: design
    depends_on: [research]
  - id: implement
    description: Implement backlog filter/search and direct-edit UI to satisfy the behavior specs and /design wireframe output.
    agent: developer
    depends_on: [behavior-spec, ui-design]
  - id: test
    description: Derive test cases from behavior specs and verify they pass.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation, behavior specs, and tests for correctness.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/consus
  tech_stack:
    frontend: react+vite
    backend: node+typescript (fastify)

files_to_modify:
  - file: web/src/features/kb/BacklogBrowser.tsx
    change: Create — filter/search UI over all kb_entries.
  - file: server/routes/kb.ts
    change: Extend — add search/filter query params and a direct-edit endpoint.

code_examples:
  - title: KB Browser's view+decide pattern to extend
    file: web/src/features/kb/KBBrowser.tsx
    snippet: |
      # Established by kb-decide-ui — BacklogBrowser.tsx extends the same
      # component family with search/filter and a direct-edit path.

design_decisions:
  - decision: Flex scope — first candidate to slip to v2 if it threatens P0 delivery.
    rationale: Product Brief P1 explicit call: "may slip to v2 if it threatens the tighter Minerva-questions-in-Consus priority."

cross_cutting:
  - concern: documentation
    action: "None new — extends already-documented KB store schema/API; no new domain vocabulary."

risks:
  - severity: low
    description: Scope may be cut entirely from v1 per the flex-scope call.
    mitigation: This story is explicitly the deferral valve — cutting it does not block any P0 requirement.

references:
  - path: .pHive/planning/product-brief.md
    relevant_excerpt: |
      KB backlog full browse + edit + chat as a complete experience, not
      just view + decide + store. ... first to slip to v2.
