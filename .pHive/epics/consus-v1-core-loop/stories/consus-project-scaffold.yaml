code_examples: []  # Greenfield — no existing reference implementation. This is the first story; flagged in Risks below.

design_decisions:
  - decision: SQLite over Postgres for v1.
    rationale: Single-operator, local-first, zero-ops — see architecture.md Key Decisions #2.
  - decision: React+Vite SPA over Next.js.
    rationale: Avoids re-coupling to the previously-rejected Vercel-hosted direction — see architecture.md Key Decisions #1.

cross_cutting:
  - concern: documentation
    action: "Update CONTEXT.md's Key paths section with server/, web/, and the SQLite file location once the scaffold lands — this is the first story to establish those paths."

risks:
