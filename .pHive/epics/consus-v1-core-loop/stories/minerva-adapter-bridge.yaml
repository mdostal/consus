    action: "Add 'human_request', 'Minerva Adapter', and the Question bridge contract to CONTEXT.md — new domain vocabulary and the fold-in requirement from the contract-gap finding."

risks:
  - severity: high
    description: Minerva's actual stdio transport availability/exact wire format was described by the operator, not verified against a local Minerva spec (none exists in this repo tree).
    mitigation: test-spec step should include a contract test against Minerva's real process once available; treat the Hive ABI mirror as the interface contract, verify field-for-field against Minerva at integration time.

