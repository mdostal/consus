id: minerva-adapter-bridge
epic: consus-v1-core-loop
title: Minerva Adapter — Question bridge (REQ-01)
status: pending
complexity: high
methodology: tdd
depends_on: [consus-project-scaffold]
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Implement REQ-01: the Minerva↔Consus bridge. Build a stdio JSON-RPC-shaped
  adapter mirroring Hive's existing @hive/task-tracking-dispatch ABI pattern
  (capabilities/abi_version handshake, invoke(method, params), {ok,result}/
  {ok:false,recoverable,code} error mapping) that ingests a Minerva
  `Question {id, text, channel, reason, status}` and classifier output
  `{question, suggested_channel, confidence, reason}`, translates it into a
  new `human_request` item type, and writes status changes back to Minerva.
  This is the confirmed contract-gap fix flagged during architecture — without
  it, REQ-02 (the single biggest v1 priority) has no landing type to render into.

acceptance_criteria:
  - "Given a Minerva Question {id, text, channel, reason, status} arrives over stdio, when Consus ingests it, then it is stored and rendered as a human_request item without loss of any field."
  - "Given a Minerva escalation-classifier output {question, suggested_channel, confidence, reason}, when Consus renders it, then confidence and reason are visible to the operator alongside the question text."
  - "Given a human_request item's status changes in Consus, when the status write-back fires, then Minerva's Question.status reflects the same value."
  - "Given a Minerva Question with a channel Consus doesn't yet have a queue for, when it arrives, then Consus surfaces it in a default/catch-all queue rather than dropping it silently."
  - "Given a Minerva Question is ingested, when stored, then its human_request record also carries a decision_payload translation (typically yes_no or choose_one AnswerShape, per REQ-11) so it renders through decision-card-renderer-ui's shared path rather than a bespoke UI — requires decision-request-v1-contract to be available; if not yet merged, store the human_request without a payload and backfill once it lands."

steps:
  - id: research
    description: Read ~/Code/plugin-hive/hive/lib/task-tracking-dispatch/README.md and confirm the exact ABI shape (capabilities, abi_version, invoke(method,params), NOT_FOUND/AUTH_FAILURE/RATE_LIMIT/UNKNOWN_METHOD/OPERATION_UNSUPPORTED/TIMEOUT/NO_ADAPTER error codes) to mirror faithfully.
    agent: researcher
  - id: test-spec
    description: Write failing tests for Question ingestion, classifier-output rendering fields, bidirectional status sync, and unknown-channel fallback.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the Minerva Adapter and human_request item type to make failing tests pass.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness, and confirm ABI-pattern fidelity against the Hive dispatch module.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

