design_decisions:
  - decision: Reuse Hive's existing ABI dispatch shape rather than invent a new stdio protocol.
    rationale: architecture.md Key Decisions #4 — smaller surface area, and it's the concrete shape behind the "plugin-hive adapter ABI" named as the shared transport.

cross_cutting:
