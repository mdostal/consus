id: minerva-qa-queue-ui
epic: consus-v1-core-loop
title: Minerva Q&A Queue UI — answer async (REQ-02)
status: pending
complexity: medium
methodology: bdd
depends_on: [minerva-adapter-bridge, kb-store-schema-and-decide-api, decision-card-renderer-ui]

description: |
  Implement REQ-02 — the single biggest stated v1 priority: a queue of open
  human_request items (from minerva-adapter-bridge) the operator can answer
  async, tied to their originating ticket where available. Answering writes
  through the decide API (kb-store-schema-and-decide-api) so answers are
  audit-logged like any other decision.

acceptance_criteria:
  - "Given one or more open Minerva questions exist, when the operator opens Consus, then they see a queue of unanswered questions, each linked to its originating ticket."
  - "Given the operator answers a question in Consus, when they submit, then the answer is persisted, the item's status moves to answered, and the answer is retrievable by whatever consumes it downstream."
  - "Given a question has no ticket link (channel-only escalation), when rendered, then Consus still shows it in the queue without requiring a ticket to exist."

steps:
  - id: research
    description: Confirm the human_request API from minerva-adapter-bridge and the decide API from kb-store-schema-and-decide-api.
    agent: researcher
  - id: behavior-spec
    description: Write Given/When/Then specs for queue display, answering, and ticketless-question handling, derived from this story's acceptance criteria.
    agent: tester
    depends_on: [research]
  - id: ui-design
    description: Delegate to /design for wireframes (atomic external call; see skills/design/SKILL.md). Deferred — not run live during this /plan session; run /design against this story before /execute.
    agent: ui-designer
    delegates_to: design
    depends_on: [research]
  - id: implement
    description: Implement the Q&A Queue UI to satisfy the behavior specs and /design wireframe output.
    agent: developer
    depends_on: [behavior-spec, ui-design]
  - id: test
    description: Derive test cases from behavior specs and verify they pass.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation, behavior specs, and tests for correctness.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

