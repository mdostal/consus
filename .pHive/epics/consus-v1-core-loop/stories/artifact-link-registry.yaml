id: artifact-link-registry
epic: consus-v1-core-loop
title: Artifact Link Registry — surface existing claude.ai Artifacts
status: pending
complexity: low
methodology: tdd
depends_on: [doc-browser-ui]

description: |
  Implement REQ-05: store and surface claude.ai Artifact URLs associated
  with items (initially doc_ref items from doc-browser-ui), linked/embedded
  rather than re-rendered. Explicitly does not rebuild the Artifact renderer
  — per the PRD's hard exclusion, Consus's job is to link, not reimplement.

acceptance_criteria:
  - "Given a claude.ai Artifact URL is associated with a repo/epic/decision item, when the operator views that item in Consus, then the Artifact is linked/embedded and reachable in one click."
  - "Given an Artifact link is added, when Consus renders the parent item, then no separate re-rendering of the Artifact's content is attempted — Consus surfaces the link/embed only."

steps:
  - id: research
    description: Confirm the items table shape from consus-project-scaffold to attach artifact_links correctly.
    agent: researcher
  - id: test-spec
    description: Write failing tests for artifact_links CRUD and item-view inclusion of linked Artifacts.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the artifact_links table, API, and the doc-browser-ui integration point to make failing tests pass.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness and convention compliance.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Code/consus
  tech_stack:
    backend: node+typescript (fastify)
    database: sqlite

files_to_modify:
  - file: server/db/migrate.ts
    change: Extend — add artifact_links table (id, item_id FK, url, label).
  - file: server/routes/artifact-links.ts
    change: Create — CRUD endpoints.
  - file: web/src/features/docs/ArtifactLink.tsx
    change: Create — link/embed component reused wherever items render.

code_examples:
  - title: doc_index table pattern to follow for artifact_links' item_id FK relationship
    file: server/db/migrate.ts
    snippet: |
      # Established by doc-scanner-and-index — artifact_links follows the same
      # item_id FK + migrate.ts idempotent-extension pattern.

design_decisions:
  - decision: Link/embed only, no content re-fetch or re-render of Artifact HTML.
    rationale: PRD hard exclusion — "Rebuilding the claude.ai Artifact renderer... it already works."

cross_cutting:
  - concern: documentation
    action: "Add artifact_links to CONTEXT.md Key paths / schema notes once implemented."

risks:
  - severity: low
    description: None significant — small, additive story.
    mitigation: n/a

references:
  - path: .pHive/planning/prd.md
    relevant_excerpt: |
      REQ-05: Existing Artifact Surfacing — link and surface existing claude.ai
      Artifacts inside Consus rather than rebuilding the renderer.
