id: auriga-tracker-reader
epic: consus-v1-core-loop
title: Auriga Tracker Reader — read-only state consumption (REQ-06)
status: pending
complexity: medium
methodology: tdd
depends_on: [consus-project-scaffold]
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  Implement REQ-06: a read-only client against Auriga's tracker/observability
  surface (EventContract + ConsumerContract + LockContract + TrackerAdapter,
  Multica-backed). Consus displays dispatch/close/error/retry state; it never
  calls dispatch/claim/close. This is architecture.md's single largest flagged
  risk — the exact schema is unconfirmed locally (no Auriga repo/spec exists
  on disk as of this epic's kickoff) and is pending
  docs/contracts/pantheon-contract-levels.md landing in the meta repo.

acceptance_criteria:
  - "Given Auriga's tracker/observability surface, when Consus queries it, then Consus displays current dispatch/close/error/retry state for tracked work without issuing any dispatch, claim, or close calls itself."
  - "Given an event's state changes in Auriga (e.g. dispatch → close), when Consus next reads the tracker surface, then the displayed state reflects the change."
  - "Given Consus has no dispatch capability by design, when an operator approves a decision in Consus that implies 'go do this work,' then Consus records the approval and hands off via Multica/the appropriate contract — it does not attempt to call Auriga's dispatch path directly."

steps:
  - id: research
    description: |
      Check whether docs/contracts/pantheon-contract-levels.md has landed in
      the meta repo yet (it was in flight as of this epic's kickoff). If
      present, use its EventContract/ConsumerContract/LockContract/
      TrackerAdapter schema directly. If absent, build the internal
      interface against REQ-06's behavioral contract only (read-only,
      dispatch/close/error/retry state) and leave the wire-format binding
      as a swappable implementation detail per architecture.md's guidance.
    agent: researcher
  - id: test-spec
    description: Write failing tests against the internal Auriga Tracker Reader interface (mocked transport) — read current state, reflect state changes, and assert no dispatch/claim/close call is ever made.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the Auriga Tracker Reader to make failing tests pass, wiring the real transport if pantheon-contract-levels.md has landed, else a documented stub interface matching the behavioral contract.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness, and confirm the read-only boundary is enforced (no dispatch/claim/close call sites exist).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

