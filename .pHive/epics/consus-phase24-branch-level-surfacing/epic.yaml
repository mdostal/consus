    title: Ref-aware doc reading (git show/git ls-tree/git diff), safe argument handling
    complexity: medium
    depends_on: []
  - id: s2-branch-scoped-decisions
    title: source_branch column + ref-aware ingest + GET /api/decisions?branch= filtering
    complexity: medium
    depends_on: [s1-git-ref-plumbing]
  - id: s3-doc-diff-endpoint
    title: GET /api/docs/diff — a doc's content on a branch vs. the default branch
