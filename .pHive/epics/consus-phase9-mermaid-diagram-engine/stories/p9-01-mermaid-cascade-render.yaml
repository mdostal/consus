      purpose: "Reference for renderCascadeMermaid's node/edge Mermaid-string-building shape (sanitizeMermaidId, escapeMermaidLabel, declare-then-link) — the part worth re-deriving fresh against local data; buildCascadeTree/buildMulticaForest in the same file is Multica-coupled and must not be ported (git show to read; not present in the current working tree)."

files_to_modify:
  - file: package.json
    change: Add mermaid (^11.16.1) to dependencies.
  - file: web/src/features/projects/DiagramView.tsx
    change: Add a client-side epics-to-Mermaid-source builder function; replace the nested <ul> rendering with a container that mermaid.render() output is written into, with loading/error/timeout handling; keep all other props and the propose-change/audit sections unchanged.
  - file: web/src/features/projects/DiagramView.test.tsx
    change: Mock the mermaid module; update/add assertions for graph-source content, empty-state behavior, and unaffected propose-change/audit behavior.

design_decisions:
  - decision: Build the Mermaid source string client-side from the existing epics prop, rather than adding a server-side diagram-generation endpoint.
    rationale: GET /api/diagrams already returns the full epics/stories/dependsOn tree; the archived version's server-side Mermaid-string generation was only server-side because it needed to combine Multica-fetched issues with on-disk epic.yaml data. Mainline has no such combination to do — it's local YAML only — so generating the graph text where it's consumed avoids a needless new backend route.
  - decision: Dynamically import mermaid rather than a static top-level import.
    rationale: mermaid is a large dependency; only the diagram view needs it, and the archived DiagramViewer.tsx already established the code-splitting pattern worth following for bundle size.
  - decision: Re-derive the Mermaid-string-building logic fresh rather than importing/copying cascade-tree-builder.ts wholesale.
    rationale: That file mixes genuinely reusable mechanics (id sanitizing, label escaping, node/edge declaration) with Multica-specific issue classification (classifyKind, buildMulticaForest) that has no equivalent in mainline's data model; copying the whole file would import dead/inapplicable code and risk quietly reintroducing a MulticaClient type dependency.
  - decision: Keep the propose-a-change form, pendingProposal pill, and AuditPanel history section untouched in this story.
    rationale: Explicit scope boundary — this story is a rendering swap only. Regressing the propose-change action (per the task's own constraint) would undermine the one thing already working well in this view.

risks:
  - severity: medium
    description: mermaid is a large dependency that bundles its own layout engine; adding it could noticeably increase the app's bundle size.
    mitigation: Dynamic import so it's only loaded when a diagram view actually mounts, not on initial app load.
  - severity: medium
    description: mermaid.render() runs against a real DOM and can hang or throw on malformed graph text or in constrained environments; it also doesn't render meaningfully under jsdom/vitest.
    mitigation: Add a render timeout with a fallback message (per the archived DiagramViewer.tsx's 5s Promise.race pattern); mock the mermaid module entirely in tests rather than exercising real rendering.
  - severity: low
    description: A repo with many epics/stories could produce a visually dense, hard-to-read graph.
    mitigation: No node cap proposed given current small data volumes (single-digit epics, low tens of stories per repo); revisit only if it becomes a measured problem.
