id: p9-01-mermaid-cascade-render
epic: consus-phase9-mermaid-diagram-engine
title: Render the epic/story cascade as a real Mermaid diagram
status: pending
complexity: medium
methodology: bdd
depends_on: []

description: |
  `DiagramView.tsx` (web/src/features/projects/DiagramView.tsx) currently
  renders a repo's epic/story dependency cascade as plain nested `<ul>`
  lists — an explicit, documented deferral (see the component's own source
  comment and architecture.md decision #3: "DAG/diagram engine explicitly
  deferred"). This story replaces the nested-list rendering with an actual
  graphical diagram, built with the `mermaid` npm package, using the same
  `epics` data the component already receives as a prop — no new backend
  route or response-shape change.

  The archived branch `archive/dev-2026-08-11-pantheon-coupled` built this
  once already (`web/src/components/DiagramView.tsx`, ~275 lines, and
  `DiagramViewer.tsx`, ~203 lines), using real Mermaid rendering
  (`mermaid.render()` into a container div via `dangerouslySetInnerHTML` or
  `innerHTML`), not hand-rolled SVG. That version fetched pre-built Mermaid
  *source text* from the server, generated server-side by
  `server/lib/cascade-tree-builder.ts`'s `renderCascadeMermaid` — which in
  turn depended on `buildCascadeTree()` pulling live issues from a
  `MulticaClient`. That Multica dependency is not being ported; instead, the
  Mermaid source string is built client-side, directly from the `epics` prop
  already passed into `DiagramView`, following the same simple
  id-sanitize/label-escape/declare-nodes/declare-edges shape
  `renderCascadeMermaid` used, re-derived fresh (not imported) since the
  original also carried unrelated Multica-issue-classification logic that
  doesn't apply to local `.pHive/epics/*/epic.yaml` data.

  Everything else about `DiagramView` — the header, the "Propose a change"
  form and its `onProposeChange` callback, the `pendingProposal` pill, and
  the `AuditPanel` history section — stays exactly as it is today. This
  story only replaces the `<ul>` rendering block with a Mermaid-rendered
  graph.

acceptance_criteria:
  - "Given a repo with one or more epics, each with stories and dependsOn edges, when DiagramView renders, then it displays an actual Mermaid-rendered graph (an SVG produced by mermaid.render()) showing each epic and its stories as nodes and each dependsOn relationship as an edge, replacing the current nested <ul> markup."
  - "Given a repo with zero epics, when DiagramView renders, then the existing 'No epics yet for {repo}' empty state is shown unchanged (no Mermaid render attempted with empty input)."
  - "Given the diagram is rendering, when mermaid.render() throws or the rendering component unmounts before it resolves, then a readable inline error/fallback message is shown instead of a blank or broken panel, and the rest of the view (header, propose-change form, audit history) remains usable."
  - "Given the existing propose-a-change flow (composing box, Fire to harness button, onProposeChange callback, pendingProposal pill) and the AuditPanel history section, when this story is complete, then both continue to work exactly as before — this story changes only the read-only rendering of the cascade, not the propose/audit surface."
  - "Given DiagramView.test.tsx's existing test suite, when this story is complete, then it is updated (mocking the mermaid module, per the archived branch's vi.mock('mermaid', ...) pattern, since mermaid.render() does not run meaningfully under jsdom) so tests assert the diagram-rendering call happens with graph text derived from the given epics/stories, without depending on real Mermaid layout output."

steps:
  - id: add-mermaid-dependency
    description: |
      Add `mermaid` (^11.16.1, matching the version the archived branch used)
      to package.json's dependencies. Confirmed: mainline's root
      package.json (single package.json for the whole app, no separate
      web/package.json) does not currently depend on mermaid or any other
      diagramming library. Import it dynamically (`await import("mermaid")`)
      inside the rendering effect rather than as a static top-level import,
      so it code-splits into a chunk loaded only when a diagram view mounts
      (matches the archived DiagramViewer.tsx's approach; the archived
      DiagramView.tsx used a static import instead — prefer the dynamic
      approach here for bundle size).
    agent: developer
  - id: build-mermaid-source-from-epics
    description: |
      Add a small, pure client-side function (e.g. in DiagramView.tsx or a
      co-located helper module) that takes DiagramEpic[] (the type already
      defined in DiagramView.tsx) and returns a Mermaid graph source string:
      sanitize each epic/story id into a Mermaid-safe node id, escape labels
      (quotes), declare one node per story (grouped/labeled by epic, e.g. via
      Mermaid subgraphs keyed by epic id/title), and declare one edge per
      dependsOn relationship. Follow the same node-declare-then-edge-declare
      shape the archived cascade-tree-builder.ts's renderCascadeMermaid used
      (graph direction: start with graph LR, matching the archived cascade
      renderer, revisit if it doesn't read well against real multi-epic
      data), but write it fresh against the local DiagramEpic/DiagramStory
      types rather than importing the archived file (which mixed in
      Multica-issue-classification concerns that don't apply here).
    agent: developer
  - id: render-mermaid-in-diagram-view
    description: |
      Replace DiagramView's current <ul className="diagram-view__epics">
      block with a container div that mermaid.render() output is written
      into, following the archived DiagramView.tsx's pattern: call
      mermaid.initialize({ startOnLoad: false, ... }) once, then
      mermaid.render(uniqueId, source) inside a useEffect keyed on the
      epics prop, write the returned svg into the container (via a ref, not
      raw innerHTML string interpolation, to avoid unnecessary
      dangerouslySetInnerHTML if a safer path is available), and guard
      against a stale/unmounted render per the archived version's
      `cancelled` flag pattern. Add a render timeout (the archived
      DiagramViewer.tsx used 5000ms via Promise.race) with a friendly
      fallback message on timeout or render failure, matching the acceptance
      criteria above. Preserve the empty-epics-array early return exactly as
      it exists today.
    agent: developer
  - id: update-tests
    description: |
      Update web/src/features/projects/DiagramView.test.tsx to mock the
      mermaid module (vi.mock("mermaid", () => ({ default: { initialize:
      vi.fn(), render: vi.fn(async (id, source) => ({ svg: ..., bindFunctions:
      vi.fn() })) } })), matching the archived branch's test pattern, since
      mermaid.render() does not produce meaningful output under
      jsdom/vitest. Assert: the mock's render is called with graph text
      containing each epic/story's expected node content and dependsOn
      edges; the empty-epics state still shows the unchanged 'No epics yet'
      message without invoking render; the propose-change form and
      AuditPanel-rendering behavior are unaffected (reuse/extend existing
      assertions for those, don't remove them).
    agent: tester
  - id: manual-verification
    description: |
      Run the app locally (npm run dev), open a project with at least one
      epic that has stories with dependsOn edges, and confirm: a real
      rendered diagram appears instead of the nested list, the propose-a-
      change form still fires proposals correctly, and the audit history
      panel still populates as before.
    agent: tester

