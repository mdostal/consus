id: s1-two-pane-decisions-layout
epic: consus-phase16-two-pane-decisions-layout
title: Split the Decisions tab into an independently-scrolling list+detail two-pane layout with a ?selected= URL param
status: pending
complexity: low
methodology: tdd
depends_on: []

description: |
  The Decisions tab (web/src/App.tsx's DecisionsSection, lines 243-282) renders every open decision
  and then every decided decision as a single flat, vertically-stacked list of full inline
  DecisionView cards (lines 75-237) — no list+detail split, no way to link directly to one decision.
  This story replaces that flat layout with a two-pane layout: a left-hand scannable list and a
  right-hand independently-scrolling detail panel, with the current selection addressable via a
  `?selected=<id>` query param on the page URL. DecisionView (the existing rich per-item renderer —
  context, option previews, verdict/AnswerControl, CommentThread, AuditPanel) is reused unchanged as
  the detail pane's body; DecisionCard.tsx is not touched, since it isn't what the Decisions tab
  renders today (it's used only by KBBrowser) and swapping to it would drop functionality DecisionView
  already provides — see design-discussion.md's "Resolved design decision" section. Standalone-only:
  no new backend route, reuses the existing GET /api/decisions?all=1 fetch App() already performs and
  passes to DecisionsSection as props. No router library exists in this codebase (confirmed: no
  react-router-dom in web/package.json, no <Route>/<BrowserRouter> in App.tsx) — selection/URL sync is
  hand-rolled with URLSearchParams + window.history.replaceState via a small new hook, not a new
  dependency.

acceptance_criteria:
  - "Given decisions data has loaded, when the Decisions tab renders, then a left list pane and a right detail pane are both present as distinct scroll containers (independent overflow-y: auto), not one long page-scrolling list as today."
  - "Given the list pane shows multiple decisions, when the operator clicks a row for decision id X, then the page URL's `?selected=` query param becomes X and the detail pane renders that decision (its title/question visible in the DOM) without a page reload."
  - "Given the page is loaded directly with `?selected=<id>` for an id present in the fetched decisions, when DecisionsSection mounts, then that decision is pre-selected and shown in the detail pane without requiring a click."
  - "Given the page is loaded with `?selected=` absent, or set to an id not present in the fetched decisions, when DecisionsSection renders, then it falls back to a sane default selection (first open decision, else first decided decision, else an explicit empty-state message) rather than a blank pane or a crash — and this fallback does not itself rewrite the URL."
  - "Given a decision is decided via the verdict flow inside the detail pane (DecisionView's onDecided calling reload()), when reload completes and a fresh `decisions` array is passed back down, then the same decision id remains selected and its updated decided state is reflected, rather than the selection being silently cleared."
  - "Given the new decisions-two-pane.css stylesheet, when read at the source level (jsdom does not evaluate CSS layout), then it contains a `@media (max-width: 768px)` rule that collapses the two-pane container to a single column."
  - "Given the existing DecisionCard.test.tsx and KBBrowser.test.tsx suites, when this story's changes land, then both pass unmodified, since DecisionCard.tsx itself is not changed by this story."
  - "Given the existing App.test.tsx assertions about Decisions-tab nav-button visibility gating (on non-empty docs/kb/decisions) and loading-state smoke checks, when this story's changes land, then those assertions pass unmodified."
  - "Given this story ships, then no new backend route or fetch call is added — the two-pane layout is populated entirely from the existing GET /api/decisions?all=1 fetch already performed in App()."

steps:
  - id: write-failing-tests
    description: >
      Add vitest specs for the two new files: web/src/features/decisions/useSelectedDecisionId.test.ts
      (covers reading an initial ?selected= from window.location.search, select() updating the URL via
      replaceState without adding a history entry, and responding to a popstate event) and
      web/src/features/decisions/DecisionListPane.test.tsx (covers rendering grouped open/decided rows,
      calling onSelect on click and on Enter/Space keydown, and marking the selected row via
      aria-selected). Extend web/src/App.test.tsx with specs covering: both panes render as distinct
      scroll containers; clicking a list row updates window.location's ?selected= and shows that
      decision's detail; mounting with ?selected=<id> pre-selects it; mounting with a missing or
      unknown ?selected= value falls back to the first open (else first decided, else empty-state)
      decision without rewriting the URL; the same decision stays selected across a reload() triggered
      by recording a verdict. Also add a plain source-level test asserting
      decisions-two-pane.css contains a `@media (max-width: 768px)` rule. Follow App.test.tsx's
      existing fetch-mock conventions (firstRunFetchMock and friends) rather than inventing new ones.
    agent: tester
  - id: add-selection-hook-and-list-pane
    description: >
      Add web/src/features/decisions/useSelectedDecisionId.ts: a hook returning
      [selectedId: string | null, select: (id: string) => void], reading the initial value from
      `new URLSearchParams(window.location.search).get("selected")`, writing via
      `window.history.replaceState` (not pushState) on select(), and subscribing to `popstate` to stay
      in sync with back/forward navigation. Add web/src/features/decisions/DecisionListPane.tsx: a
      presentational component taking a duck-typed item shape ({ id, title, status, decided_at,
      decision_type? } — structurally compatible with App.tsx's DecisionItem, no import from App.tsx)
      grouped into open/decided sections with the existing "Needs you (N)" / "Decided (N)" heading
      copy, selectedId, and onSelect; rows are clickable and keyboard-activatable
      (role="option"/tabIndex/Enter+Space) with aria-selected reflecting selectedId.
    agent: developer
    depends_on: [write-failing-tests]
  - id: wire-two-pane-layout-into-app
    description: >
      In web/src/App.tsx, rewrite DecisionsSection's body (keeping its existing
      `{ decisions, reload }` prop signature) to: compute open/decided as today; call
      useSelectedDecisionId(); compute effectiveId as selectedId if it matches a fetched decision,
      else the first open decision's id, else the first decided decision's id, else null; render
      DecisionListPane in a left pane and, in a right pane, either `<DecisionView item={selected}
      onDecided={reload} />` (selected = decisions.find by effectiveId) or an empty-state message when
      effectiveId is null. DecisionView's own function body is not modified. Add
      web/src/features/decisions/decisions-two-pane.css (grid/flex two-column container, each pane
      `overflow-y: auto` with `min-height: 0` on the scrolling child, `@media (max-width: 768px)`
      collapsing to a single stacked column) and import it from App.tsx alongside the existing
      theme/tokens.css and app.css imports.
    agent: developer
    depends_on: [write-failing-tests]
  - id: make-tests-pass
    description: >
      Run the full web test suite and adjust the hook/list-pane/App.tsx wiring as needed until every
      new test from write-failing-tests passes without modifying the tests themselves, and until the
      full existing suite (App.test.tsx in full, DecisionCard.test.tsx, KBBrowser.test.tsx, and every
      other currently-passing web test) still passes unchanged.
    agent: developer
    depends_on: [add-selection-hook-and-list-pane, wire-two-pane-layout-into-app]
  - id: review
    description: >
      Review for: DecisionCard.tsx is genuinely untouched (diff has zero changes to that file);
      DecisionView's body is genuinely untouched (diff shows only its call site moving, not its
      internals); the selection fallback logic is applied identically whether ?selected= is absent or
      unknown; replaceState is used (not pushState) so clicking through many decisions doesn't spam
      browser history; the CSS scroll-containment (min-height: 0) is present so panes actually scroll
      independently rather than growing the page; and no test was weakened (e.g. loosened matchers) to
      make it pass.
    agent: reviewer
    depends_on: [make-tests-pass]
  - id: integrate
    description: Commit the two-pane Decisions layout changes and their tests.
    agent: developer
    depends_on: [review]

