design_decisions:
  - decision: "The detail pane renders the existing DecisionView unchanged, not DecisionCard."
    rationale: "DecisionCard is not what the Decisions tab renders today (only KBBrowser uses it) and lacks functionality DecisionView already has live (previews, comments, audit trail). Swapping to DecisionCard would silently regress functionality — a bigger, unrequested scope change that conflicts with this epic's 'small scope, not a rewrite' constraint. See design-discussion.md."
  - decision: "Selection state lives in ?selected= via a hand-rolled hook using URLSearchParams + history.replaceState, not a router library."
    rationale: "No router dependency exists in web/package.json or App.tsx today; adding one for a single query param would be disproportionate. replaceState (not pushState) avoids one browser-history entry per row click, matching the archived precedent's own { replace: true } choice."
  - decision: "Missing and invalid ?selected= values are handled identically: fall back to first open, else first decided, else empty state — and this fallback never rewrites the URL."
    rationale: "Uniform handling avoids a special-cased branch for 'unknown id' vs 'no id'. Not rewriting the URL on the automatic default avoids mutating history/URL on a bare page load that the user didn't initiate."
  - decision: "The list pane renders compact rows, not a full DecisionView/DecisionCard per item."
    rationale: "A list of full rich cards is what today's flat layout already does and is exactly the problem being fixed (unscannable, no detail focus). Compact rows keep the list cheap to render and scannable; full detail is reserved for the single selected item."
  - decision: "Narrow-viewport (<768px) collapse is CSS-only (a media query), no JS viewport-detection branching."
    rationale: "Keeps the change small and stateless; matches the archived precedent's own approach and breakpoint. jsdom doesn't evaluate CSS layout, so this is verified at the CSS-source level in tests, with a real-browser spot-check left to review."

risks:
  - severity: low
    description: "Independent-scroll panes require a bounded-height container coordinated with the existing app shell's nav/header CSS; incorrect height math could produce a double scrollbar or a pane that doesn't scroll."
    mitigation: "Use the standard flex/grid min-height: 0 pattern on the scrolling children, and visually verify in the running app during review, not just via unit tests."
  - severity: low
    description: "jsdom does not evaluate CSS media queries, so the narrow-viewport acceptance criterion can only be pinned at the CSS-source level in the automated suite, not via a real rendered-layout assertion."
    mitigation: "Accepted; the review step explicitly calls for a manual/real-browser spot-check of the 768px collapse as a supplement to the source-level test."
  - severity: low
    description: "This plan diverges from the task's literal wording that DecisionCard should be reused in the detail panel, based on what the current codebase actually contains (DecisionCard isn't used by the Decisions tab today)."
    mitigation: "Explicitly documented and resolved in design-discussion.md's 'Resolved design decision' section with rationale, rather than silently deviated from or left blocking."
