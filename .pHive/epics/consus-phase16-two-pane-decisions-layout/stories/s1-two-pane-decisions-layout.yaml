      purpose: "DecisionItem type (lines 34-45), DecisionView (75-237, unchanged by this story), DecisionsSection (243-282, rewritten body / same props), App() (1070-1073, owns the decisions fetch + reload(), 1159 renders DecisionsSection). Central file this story edits."
    - path: web/src/features/decisions/DecisionCard.tsx
      purpose: "Explicitly NOT touched by this story — used only by KBBrowser.tsx today, not by the Decisions tab. See design-discussion.md's 'Resolved design decision' for why DecisionView, not DecisionCard, is what the new detail pane renders."
    - path: web/src/features/decisions/DecisionCard.test.tsx
      purpose: "Existing coverage for DecisionCard standalone — must keep passing unmodified since DecisionCard.tsx is not changed."
    - path: web/src/features/kb/KBBrowser.tsx
      purpose: "The only current consumer of DecisionCard — read-only context to confirm this story's changes don't affect it."
    - path: web/src/App.test.tsx
      purpose: "Existing shallow Decisions-tab coverage (nav-button visibility gating, loading-state smoke checks against /api/decisions fetch mocks) to extend, and whose existing fetch-mock helper conventions (firstRunFetchMock etc.) new specs should follow."
    - path: web/src/app.css
      purpose: "Existing .dv/.dv__*, .group-heading, .empty classes DecisionView/DecisionsSection already use and that the new two-pane layout should keep using rather than duplicating."
    - path: web/package.json
      purpose: "Confirms no router dependency exists (no react-router-dom) — selection/URL sync must be hand-rolled, not add a new dependency."

files_to_modify:
  - file: web/src/App.tsx
    change: "Rewrite DecisionsSection's body to compose the two-pane layout via useSelectedDecisionId + DecisionListPane + DecisionView; import decisions-two-pane.css. DecisionView's own function body is unchanged."
  - file: web/src/App.test.tsx
    change: "Add/extend specs covering both panes rendering, URL updates on selection, ?selected= pre-selection, invalid/missing id fallback, and selection persisting across a verdict-triggered reload()."
  - file: web/src/features/decisions/useSelectedDecisionId.ts
    change: "New hook: reads/writes the ?selected= query param via URLSearchParams + history.replaceState, syncing with popstate."
  - file: web/src/features/decisions/useSelectedDecisionId.test.ts
    change: "New test file covering the hook in isolation."
  - file: web/src/features/decisions/DecisionListPane.tsx
