code_examples:
  - title: "Fetch/list/add pattern to mirror (AttachmentsPanel.tsx)"
    file: web/src/features/decisions/attachments/AttachmentsPanel.tsx
    snippet: |
      const loadAttachments = useCallback(async () => {
        setListError(null);
        try {
          const res = await fetch(`/api/items/${encodeURIComponent(itemId)}/attachments`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          setAttachments(await res.json());
        } catch (e) {
          setListError(`Could not load attachments: ${(e as Error).message}`);
          setAttachments([]);
        }
      }, [itemId]);

