id: s1-artifact-link-shared-component
epic: consus-survey-native-rich-decisions
title: Build a real ArtifactLinksPanel (fetch + list + add), reusing the existing ArtifactLink presentational component
status: pending
complexity: low
methodology: classic
depends_on: []

description: |
  Real, precise finding: `web/src/features/docs/ArtifactLink.tsx` is a real,
  tested, presentational component (renders one `<a>` for one {url, label})
  but has ZERO usages anywhere in the app today -- not in Docs, not in
  Decisions. The real API (`server/routes/artifact-links.ts`, REQ-05:
  `GET/POST /api/items/:id/artifact-links`) has never had a UI consumer at
  all. This story builds the missing fetch/list/add wrapper -- mirroring
  `AttachmentsPanel.tsx`'s own real, proven pattern (fetch-on-mount, POST to
  add, re-fetch rather than trust the POST response shape) -- and moves
  `ArtifactLink` out of `features/docs/` into a shared location
  (`features/decisions/artifact-links/` matches the existing sibling
  `features/decisions/attachments/` convention) since both Decisions (s2/s3)
  and Docs will consume it.

acceptance_criteria:
  - "Given a decision item with zero artifact-links, when ArtifactLinksPanel mounts, then it shows a real empty state (not an error) and a real add-link form (url + optional label)"
  - "Given a real POST to /api/items/:id/artifact-links succeeds, when the panel re-fetches, then the new link renders via ArtifactLink"
  - "Given the API is unreachable, when the panel mounts, then it shows a clear 'could not load' state, never a crash -- same convention as AttachmentsPanel's listError handling"
  - "Given the move out of features/docs/, when the existing ArtifactLink.test.tsx is updated for the new path, then it still passes unchanged in substance"

steps:
  - id: research
    description: Read AttachmentsPanel.tsx and AttachmentList.tsx in full for the exact fetch/list/add pattern to mirror; read artifact-links.ts's real request/response shapes
    agent: researcher
  - id: implement
    description: Move ArtifactLink.tsx to features/decisions/artifact-links/, build ArtifactLinksPanel.tsx (fetch-on-mount list + add form) mirroring AttachmentsPanel's structure
    agent: developer
    depends_on: [research]
  - id: test
    description: Update/move ArtifactLink.test.tsx, add real tests for ArtifactLinksPanel (empty state, add flow, error state) mirroring AttachmentsPanel's own test coverage
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm no behavior change to any existing Docs feature (ArtifactLink was unused there, so this is a pure move, not a functional change to Docs)
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

