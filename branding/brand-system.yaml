# Consus — brand-system.yaml
# Conforms to hive/references/brand-system-schema.yaml
# Generated by /brand-system (ui-designer persona), inline-SVG fallback path
# (openai-image MCP unavailable — see brand-guide.html Logo Concepts section)

colors:
  primary:
    name: "Granary Indigo"
    hex: "#362B6B"
    rgb: "rgb(54, 43, 107)"
    cmyk: "cmyk(50, 60, 0, 58)"
    pms: "PMS 2685 C (approx.)"
    usage: "Primary actions, CTAs, active nav state, key UI chrome — the deep dusk under which counsel is given"
  secondary:
    name: "Threshing Gold"
    hex: "#9C6316"
    rgb: "rgb(156, 99, 22)"
    cmyk: "cmyk(0, 37, 86, 39)"
    pms: "PMS 7568 C (approx.)"
    usage: "Accents, highlighted state, decision/verdict emphasis, badges — the stored grain, used sparingly against indigo"
  neutral:
    name: "Quern Charcoal"
    hex: "#46414F"
    rgb: "rgb(70, 65, 79)"
    cmyk: "cmyk(11, 18, 0, 69)"
    pms: "PMS 5265 C (approx.)"
    usage: "Body text, secondary content, borders — an indigo-tinted charcoal so neutral text still reads as part of the same family"
  surface:
    name: "Parchment"
    hex: "#FAF7F0"
    rgb: "rgb(250, 247, 240)"
    cmyk: "cmyk(0, 1, 4, 2)"
    pms: "PMS 7527 C (approx.)"
    usage: "App backgrounds, cards, containers — warm off-white, evoking ledger paper rather than clinical white"

typography:
  heading_font: "Fraunces"
  body_font: "IBM Plex Sans"
  scale: [12, 14, 16, 18, 24, 32, 48]
  weights:
    - weight: 400
      name: "Regular"
      usage: "Body copy, captions, table cells"
    - weight: 500
      name: "Medium"
      usage: "Labels, nav items, form field text"
    - weight: 600
      name: "SemiBold"
      usage: "Subheadings, card titles, emphasis within body copy"
    - weight: 700
      name: "Bold"
      usage: "Page headings, primary CTAs, the wordmark"
  usage_guidance: "Fraunces (a modern serif with old-style, slightly carved detailing) carries all display text and the wordmark — it supplies the 'ancient-but-considered' half of the personality without becoming decorative. IBM Plex Sans, a precise technical sans built for developer tooling, carries every line the user actually reads and interacts with: body copy, UI labels, forms, tables. Never swap the two roles — Fraunces at small sizes reads noisy, and Plex Sans at display size reads generic."

spacing:
  base: 4
  scale: [4, 8, 12, 16, 24, 32, 48, 64]

radius:
  small: 4
  medium: 8
  large: 14
  full: 9999

personality:
  statement: "Consus is the quiet keeper of a repo's decisions — a granary where what's been settled is stored safely, and a counselor you consult before deciding what's next."
  tone: "precise, trustworthy, unshowy, quietly mythic"
  voice_principles:
    - "Speak like counsel, not a dashboard — direct and considered, never hyped."
    - "Store before you show — nothing surfaces until it has actually been reasoned through."
    - "Confidence through clarity, not decoration — certainty is earned in the content, not styled on top of it."

concept_directions:
  - "granary-seal emblem"
  - "counsel-arch monogram"
  - "grain-kernel abstract mark"
