site_name: Consus Docs
site_url: https://mdostal.github.io/consus/docs/
site_description: Documentation for Consus — the architect tool for any repo
repo_url: https://github.com/mdostal/consus
repo_name: mdostal/consus
docs_dir: docs
site_dir: docs_site

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - First Project: getting-started/first-project.md
    - Desktop App: getting-started/desktop-app.md
  - Concepts:
    - Core Loop: concepts/core-loop.md
    - Architecture: concepts/architecture.md
    - Decisions: concepts/decisions.md
    - Knowledge Base: concepts/knowledge-base.md
  - Configuration: configuration.md
  - API Reference: api/index.md
  - Agent Integration:
    - Claude Code Skill: agent-integration/skill.md
    - Harness Transport: agent-integration/harness-transport.md
    - Examples: agent-integration/examples.md
  - Visual System:
    - Skins: visual/skins.md
    - Themes: visual/themes.md
  - Contributing: contributing.md
  - Project:
    - Vision: project/vision.md
    - Changelog: project/changelog.md
